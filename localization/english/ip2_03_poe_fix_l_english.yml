 princely_states.6.t: "Spreading Dissent"
 princely_states.6.d: "Our seeds of dissent have begun to bear fruit. We may be able to convince another of the [Concept('concept_princely_state', '$concept_princely_states$')] to join our rebellion against the [SCOPE.sCountry('overlord_scope').GetName].\n\nThe question now, is on who do we focus our efforts?"
