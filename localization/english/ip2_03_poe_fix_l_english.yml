 je_princely_states_stockpile_munitions_desc: "We must stockpile weapons and ammunition to ensure ourselves and our rebel allies are properly supplied for the forthcoming rebellion.\n\nHalf of all #b locally produced#! [SCOPE.sGoods('small_arms_scope').GetName], [SCOPE.sGoods('artillery_scope').GetName], and [SCOPE.sGoods('ammunition_scope').GetName] will be spread among the potential rebels for use during the rebellion.\n\n$je_princely_states_stockpile_status$"
