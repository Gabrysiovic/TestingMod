  india_non_cooperation.8.t: "Successful Swadeshi"
  india_non_cooperation.8.d: "Boycotts, local production, and economic nationalism has proven triumphant. The impact of the #b Swadeshi Movement#! on the [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFlag] economy cannot be ignored, nor can the calls for Indian sovereignty."
  india_non_cooperation.8.f: "The port's warehouses stood empty now, but for once this was a good thing. [SCOPE.sCountry('overlord_scope').GetNameNoFormatting] had faced the might of the #b Indian#! nation and had #italic lost#!, with all its economic might and financial webs failing to defeat the simple strength of a united people. With the victory of self-reliance, what was next for the [SCOPE.sPoliticalMovement('indian_national_movement').GetNameNoFormatting]?"
  india_non_cooperation.8.a: "This is just the beginning."
