  je_india_swadeshi_movement_reason: "The [SCOPE.sPoliticalMovement('indian_national_movement').GetName] is gaining momentum, and its leaders have come up with a new campaign with a clear aim: economic self-sufficiency. They hope to demonstrate their movement's power by crippling the sale of foreign [SCOPE.sGoods('clothes_scope').GetName], [SCOPE.sGoods('furniture_scope').GetName], and [SCOPE.sGoods('liquor_scope').GetName] to #b India#!."

  swadeshi_timer_tt: "#b $je_india_swadeshi_movement$#! has been ongoing for at least #v 2#! years."
  indian_clothes_self_sufficient_tt: "The production of [SCOPE.sGoods('clothes_scope').GetName] in  [ROOT.GetCountry.GetAdjective] [GetGeographicRegion('geographic_region_india').GetName] (#v [ROOT.Var('indian_clothes_production').GetValue|K]#!) is #b greater than#! the consumption of [SCOPE.sGoods('clothes_scope').GetName] in [ROOT.GetCountry.GetAdjective] [GetGeographicRegion('geographic_region_india').GetName] (#v [ROOT.Var('indian_clothes_consumption').GetValue|K]#!)."
  indian_furniture_self_sufficient_tt: "The production of [SCOPE.sGoods('furniture_scope').GetName] in [ROOT.GetCountry.GetAdjective] [GetGeographicRegion('geographic_region_india').GetName] (#v [ROOT.Var('indian_furniture_production').GetValue|K]#!) is #b greater than#! the consumption of [SCOPE.sGoods('furniture_scope').GetName] in [ROOT.GetCountry.GetAdjective] [GetGeographicRegion('geographic_region_india').GetName] (#v [ROOT.Var('indian_furniture_consumption').GetValue|K]#!)."
