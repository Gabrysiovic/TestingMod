l_english:
  british_dictates.5.t: "Orders from [SCOPE.sCountry('overlord_scope').GetCapital.GetCityHubName]"
  british_dictates.5.d: "With the period of instability behind us, officials within the [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] government have brought forth ambitious plans for the [ROOT.GetCountry.GetName]. Through a sweeping series of reforms and objectives, officials hope to elevate India into the model of a colonial empire."
  british_dictates.5.f: ""A hundred years of rule and we've only begun to scratch the surface. Gentemen, if India is truly the #italic Jewel in the Crown#!, then our plans shall cut that rough diamond into the shape of unmatched beauty, wealth, and splendor. We shall become the envy of the colonized world and the utmost military, economic, and administrative power in all of Asia."\n\n"Here here," the room replied.\n\n"Then let us begin at once. Dispatch the dictates posthaste.""
  british_dictates.5.a: "We shall commence our efforts at once."
  je_british_dictates_activated_tt: "#b $je_british_dictates$#! [concept_journal_entry] has been activated."

  british_dictates.6.t: "A Model Colony"
  british_dictates.6.d: "[ROOT.GetCountry.GetAdjectiveNoFormatting] administrators meet to celebrate the completion of their ambitious agenda for the subcontinent. With the agricultural economy, military, and education system now stronger than ever before, the colonial might of the [ROOT.GetCountry.GetName] is now unquestioned and unrivaled."
  british_dictates.6.f: "India was now everything they could have dreamed of. The fieldworkers harvesting fields of dye and opium; the disciplined soldiers and sailors filling the ranks of the colonial military; the aspirant civil servants now lined up for their yearly examinations. All were emblematic of the [ROOT.GetCountry.GetNameNoFormatting]'s newfound wealth and propserity."
  british_dictates.6.a: "India now shines like never before."
  india_model_colony: "A Model Colony"

  british_dictates.7.t: "An Incomplete Agenda"
  british_dictates.7.d: "After twenty years, the grand plan for the [ROOT.GetCountry.GetName] has not come to fruition. Deadlines have been missed, objectives are incomplete, and some officials now doubt the feasibility of the effort. The [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] goverment has decided to move on to more pressing matters, leaving our efforts a footnote among many other failed government initiatives."
  british_dictates.7.f: ""It may have simply been a hopeless cause to begin with. Too many people, too much land, too many problems...""
  british_dictates.7.a: "Perhaps we were a bit too ambitious."
  india_incomplete_dictates: "An Incomplete Agenda"

  british_dictates.8.t: "The Agricutural Economy"
  british_dictates.8.d: "Large swathes of India's fertile farmland have been converted to cash crop plantations. [SCOPE.sGoods('opium_scope').GetName], [SCOPE.sGoods('dye_scope').GetName], [SCOPE.sGoods('tea_scope').GetName] and more flow in abundance from the ports of the subcontinent to the world market."
  british_dictates.8.d_plantation_construction: "With our concentrated efforts to expand the number of plantations across India, our agricultural exports now dominate the global market, bringing abundant wealth to the [ROOT.GetCountry.GetName]."
  british_dictates.8.d_plantation_productivity: "By carefully reallocating the most fertile lands to our country's plantations, we have maximized their output and ensured our agricultural domination on the global market. Proponents are calling it a victory for agricultural efficiency, and all it took was a few relocated peasants."
  british_dictates.8.f: ""The wealth of India is in its agriculture, and as the crops flow out the cash shall flow in.""
  british_dictates.8.a: "The wealth of India: sown and harvested."

  british_dictates.9.t: "The Colonial Military"
  british_dictates.9.d: "The colonial army and navy have been given all the men and resources they need to secure the [ROOT.GetCountry.GetName] from all foreign threats. The military is now the pride of our empire and the envy of colonial nations the world over."
  british_dictates.9.d_army: "The strength and power of the Colonial Army has burgeoned it into an indomitable fighting force. Soldiers patrol the entire subcontinent, and the borders are safe and secure from hostile invasion."
  british_dictates.9.d_navy: "Large investments in ships and sailors has brought us a colonial navy to match the might of our land-based forces. Our coasts and ports now stand safe in the event of piracy or warfare."
  british_dictates.9.f: ""No longer do we station a token colonial garrison, but a mighty military powerful in its own right. The burden of our defense is now fully in our own hands.""
  british_dictates.9.a: "A military worthy of the great [ROOT.GetCountry.GetNameNoFormatting]."

  british_dictates.10.t: "Indian Education"
  british_dictates.10.d: "With our eforts to increase literacy and higher learning in the [ROOT.GetCountry.GetName], we now have sufficient civil servants to serve our growing colonial apparatus."
  british_dictates.10.d_higher_education: "By focusing on the construction of new Universities, we have ensured our future civil servants are well-educated and up to the tasks our colonial administration assigns them. This few but highly educated elite shall serve the [ROOT.GetCountry.GetName] well."
  british_dictates.10.d_public_schools: "Rates of literacy and primary education have improved throughout the [ROOT.GetCountry.GetName]. By increasing access to education at all levels, our subjects will be all the more capable of serving our needs."
  british_dictates.10.f: ""Never before has the native Indian population been so well educated, and so fit to serve our administrative functions.""
  british_dictates.10.a: "A shining achievement for the [ROOT.GetCountry.GetNameNoFormatting]."

  je_british_dictates: "The Colonial Dictates"
  je_british_dictates_reason: "@information! Each dictate will offer differing strategies for achieving its objectives. Adopting a strategy will cost @aut! [concept_authority], but modify active [Concept('concept_modifier', '$concept_modifiers$')], completion conditions, and the final rewards for completing all dictates.\n$TOOLTIP_DELIMITER$\n#lore An ambitious plan has been laid out to turn the [ROOT.GetCountry.GetNameNoFormatting] into the model of a proper colonial empire. Growth in agricultural extraction, strengthening the education system, and increasing the might of the colonial military are all components of this bold new agenda.\n\nWhile officials debate the proper strategy to achieve these varied objectives, all agree upon the desired outcome: unlocking the true colonial might of the Indian subcontinent.#!"
  british_dictates_officials_put_forth_plan_tt: "Government officials have put forth a plan to unlock the power of Colonial India."
  je_british_dictate_plantations_complete_tt: "We have completed the #b $je_british_dictate_plantations$#! [concept_journal_entry]"
  je_british_dictate_military_complete_tt: "We have completed the #b $je_british_dictate_military$#! [concept_journal_entry]"
  je_british_dictate_universities_complete_tt: "We have completed the #b $je_british_dictate_universities$#! [concept_journal_entry]"
  je_british_dictates_consequences_scaled_tt: "These consequences will be reduced depending on the number of completed Dictates"

  british_dictates_time_run_out_tt: "Time has run out on #b $je_british_dictates$#! [concept_journal_entry]"
  dictate_no_prioritization_cooldown_tt: "It has been at least #v 5 years#! since we prioritized this strategy for this dictate"
  dictate_not_prioritizing_other_strategy_tt: "We are not prioritizing another strategy for this dictate"

  british_dictate_successful: "Successful Dictate"
  british_dictate_prioritization: "Dictate Administrative Focus"

  colonial_dictates_timer_tt: "This [concept_journal_entry] has been active for at least #v 2 years#!"

  je_british_dictate_plantations_completion_condition_tt: "#v [ROOT.Var('arable_land_percent_goal').GetValue|%0]#! of all [concept_arable_land] across [ROOT.GetCountry.GetAdjective] [GetGeographicRegion('geographic_region_india').GetName] and its [Concept('concept_subject', '$concept_subjects$')] has been developed into [GetBuildingGroup('bg_plantations').GetName] (Currently #v [ROOT.Var('num_plantations').GetValue]/[ROOT.Var('target_plantations').GetValue]#!)"

  british_dictate_plantations_prioritizing_construction: "Prioritizing Plantation Construction"
  colonial_prosperity_plantation_construction: "Colonial Prosperity - Plantation Construction"
  colonial_prosperity_plantation_construction_tt: "[GetStaticModifier('colonial_prosperity_plantation_construction').GetName|v]\n[GetStaticModifier('colonial_prosperity_plantation_construction').GetDesc]"
  british_dictate_plantations_prioritizing_productivity: "Prioritizing Plantation Productivity"
  colonial_prosperity_plantation_productivity: "Colonial Prosperity - Plantation Productivity"
  colonial_prosperity_plantation_productivity_tt: "[GetStaticModifier('colonial_prosperity_plantation_productivity').GetName|v]\n[GetStaticModifier('colonial_prosperity_plantation_productivity').GetDesc]"

  je_british_dictate_plantations_prioritize_construction: "Prioritize Plantation Construction"
  je_british_dictate_plantations_prioritize_construction_desc: "The construction of new plantations must be prioritized over all else. Quantity is a quality all its own, and by turning India into a landscape of plantations, we shall dominate the global cash crop market."
  je_british_dictate_plantations_prioritize_construction_new_goal_tt: "Our goal will shift from #v 30%#! of [concept_arable_land] to #v 40%#! and from being a lead producer of #v 3#! plantation goods to #v 2#!"
  je_british_dictate_plantations_prioritize_construction_new_reward_tt: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],colonial_prosperity_plantation_construction_tt $colonial_prosperity_plantation_construction$#! becomes a #v permanent#! reward for completing #b $je_british_dictates$#! [concept_journal_entry]"
  je_british_dictate_plantations_deprioritize_construction: "Deprioritize Plantation Construction"
  je_british_dictate_plantations_deprioritize_construction_desc: "We will deprioritize our efforts to increase plantation construction."
  je_british_dictate_plantations_prioritize_construction_old_goal_tt: "Our goal will shift back from #v 40%#! of [concept_arable_land] to #v 30%#! and from being a lead producer of #v 2#! plantation goods to #v 3#!"
  je_british_dictate_plantations_prioritize_construction_lose_reward_tt: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],colonial_prosperity_plantation_construction_tt $colonial_prosperity_plantation_construction$#! will no longer be a reward for completing #b $je_british_dictates$#! [concept_journal_entry]"

  je_british_dictate_plantations_prioritize_productivity: "Prioritize Increasing Productivity"
  je_british_dictate_plantations_prioritize_productivity_desc: "The right way to increase our output is to focus on quality over quantity. Relocating subsistence farmers and taking their more fertile lands for ourselves will offer better yields for less effort."
  je_british_dictate_plantations_prioritize_productivity_new_goal_tt: "Our goal will shift from #v 30%#! of [concept_arable_land] to #v 20%#! and from being a lead producer of #v 3#! plantation goods to #v 4#!"
  je_british_dictate_plantations_prioritize_productivity_new_reward_tt: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],colonial_prosperity_plantation_productivity_tt $colonial_prosperity_plantation_productivity$#! becomes a #v permanent#! reward for completing #b $je_british_dictates$#! [concept_journal_entry]"
  je_british_dictate_plantations_deprioritize_productivity: "Deprioritize Increasing Productivity"
  je_british_dictate_plantations_deprioritize_productivity_desc: "We will deprioritize our efforts to increase the productivity of our plantations."
  je_british_dictate_plantations_prioritize_productivity_old_goal_tt: "Our goal will shift back from #v 20%#! of [concept_arable_land] to #v 30%#! and from being a lead producer of #v 4#! plantation goods to #v 3#!"
  je_british_dictate_plantations_prioritize_productivity_lose_reward_tt: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],colonial_prosperity_plantation_productivity_tt $colonial_prosperity_plantation_productivity$#! will no longer be a reward for completing #b $je_british_dictates$#! [concept_journal_entry]"

  british_dictate_military_prioritizing_army: "Prioritizing Colonial Army"
  colonial_prosperity_army: "Colonial Prosperity - Army"
  colonial_prosperity_army_tt: "[GetStaticModifier('colonial_prosperity_army').GetName|v]\n[GetStaticModifier('colonial_prosperity_army').GetDesc]"
  british_dictate_military_prioritizing_navy: "Prioritizing Colonial Navy"
  colonial_prosperity_navy: "Colonial Prosperity - Navy"
  colonial_prosperity_navy_tt: "[GetStaticModifier('colonial_prosperity_navy').GetName|v]\n[GetStaticModifier('colonial_prosperity_navy').GetDesc]"

  je_british_dictate_military_prioritize_army: "Prioritize Colonial Army"
  je_british_dictate_military_prioritize_army_desc: "Our army must not only be a dominant force in Southeast Asia but among the best in the world. Through training, recruitment, and strength of arms we can not only protect India but expand our reach beyond the subcontinent into neighboring countries."
  je_british_dictate_military_prioritize_army_new_goal_tt: "Our goal will shift from #v 6500.00#! army [concept_power_projection] to #v 8000.00#! and from #v 6500.00#! naval [concept_power_projection] to #v 5000.00#!"
  je_british_dictate_military_prioritize_army_new_reward_tt: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],colonial_prosperity_army_tt $colonial_prosperity_army$#! becomes a #v permanent#! reward for completing #b $je_british_dictates$#! [concept_journal_entry]"
  je_british_dictate_military_deprioritize_army: "Deprioritize Colonial Army"
  je_british_dictate_military_deprioritize_army_desc: "We will deprioritize our efforts to bolster the Colonial Army."
  je_british_dictate_military_prioritize_army_old_goal_tt: "Our goal will shift back from #v 8000.00#! army [concept_power_projection] to #v 6500.00#! and from #v 5000.00#! naval [concept_power_projection] to #v 6500.00#!"
  je_british_dictate_military_prioritize_army_lose_reward_tt: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],colonial_prosperity_army_tt $colonial_prosperity_army$#! will no longer be a reward for completing #b $je_british_dictates$#! [concept_journal_entry]"

  je_british_dictate_military_prioritize_navy: "Prioritize Colonial Navy"
  je_british_dictate_military_prioritize_navy_desc: "A sufficient navy is necessary to protect our coasts and deploy our army where needed. What good are our other efforts if we can't ensure the safe transportation of our soldiers and exports in times of war?"
  je_british_dictate_military_prioritize_navy_new_goal_tt: "Our goal will shift from #v 6500.00#! army [concept_power_projection] to #v 5000.00#! and from #v 6500.00#! naval [concept_power_projection] to #v 8000.00#!"
  je_british_dictate_military_prioritize_navy_new_reward_tt: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],colonial_prosperity_navy_tt $colonial_prosperity_navy$#! becomes a #v permanent#! reward for completing #b $je_british_dictates$#! [concept_journal_entry]"
  je_british_dictate_military_deprioritize_navy: "Deprioritize Colonial Navy"
  je_british_dictate_military_deprioritize_navy_desc: "We will deprioritize our efforts to bolster the Colonial Navy."
  je_british_dictate_military_prioritize_navy_old_goal_tt: "Our goal will shift back from #v 5000.00#! army [concept_power_projection] to #v 6500.00#! and from #v 8000.00#! naval [concept_power_projection] to #v 6500.00#!"
  je_british_dictate_military_prioritize_navy_lose_reward_tt: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],colonial_prosperity_navy_tt $colonial_prosperity_navy$#! will no longer be a reward for completing #b $je_british_dictates$#! [concept_journal_entry]"

