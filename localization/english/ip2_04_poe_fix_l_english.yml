  india_home_rule_events.1.t_self_government: "A Sovereign India"
  india_home_rule_events.1.d_peaceful_independence: "The day has finally come. Seeing little other choice against the tide of #b Indian Nationalism#!, [SCOPE.sCountry('overlord_scope').GetName] has announced that it is relinquishing its grip on the Indian subcontinent. Authority and administration will be transferred to the new Indian government, while [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] authorities will withdraw back to their homeland. #b India#! is finally a free nation."
  india_home_rule_events.1.d_war_of_independence: "After a long and bloody war, #b India#! has emerged victorious and free. There will be time for mourning those who fought and died, but for now, people celebrate across the subcontinent. Already sovereign leaders have taken over government instutitions, ready to chart a new course for the new nation."
  india_home_rule_events.1.d_self_government: "The day has finally come. Seeing little other choice against the tide of #b Indian Nationalism#!, leaders of the colonial government have announced a series of sweeping reforms. The government of India will now represent #italic all#! of its people, including the many native Indians who fought long and hard for sovereignty, freedom, and representative self-government."
  india_home_rule_events.1.f_independence: "It had been a long, hard-fought struggle, but all that hardship had paid off. His people were free. His country was free. India was free for now and forever."
  india_home_rule_events.1.a_independence: "Long live free India!"
