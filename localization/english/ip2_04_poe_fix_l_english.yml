  colonial_prosperity_public_schools_tt: "[GetStaticModifier('colonial_prosperity_public_schools').GetName|v]\n[GetStaticModifier('colonial_prosperity_public_schools').GetDesc]"

  je_british_dictate_universities_prioritize_higher_education: "Prioritize Higher Education"
  je_british_dictate_universities_prioritize_higher_education_desc: "We must rely on a highly skilled elite of Indian civil servants to both fill out our bureaucracy and act as intermediaries with the native population. To fully educate the masses is an exercise in futility. Focusing our efforts on training promising prospects for civil administration is where we'll find success."
  je_british_dictate_universities_prioritize_higher_education_new_goal_tt: "Our goal will shift from #v 25#! [GetBuildingType('building_university').GetName] buildings to #v 40#! and from #v 40%#! [concept_literacy] to #v 30%#!"
  je_british_dictate_universities_prioritize_higher_education_new_reward_tt: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],colonial_prosperity_higher_education_tt $colonial_prosperity_higher_education$#! becomes a #v permanent#! reward for completing #b $je_british_dictates$#! [concept_journal_entry]"
  je_british_dictate_universities_deprioritize_higher_education: "Deprioritize Higher Education"
  je_british_dictate_universities_deprioritize_higher_education_desc: "We will deprioritize our efforts to expand Higher Education."
  je_british_dictate_universities_prioritize_higher_education_old_goal_tt: "Our goal will shift back from #v 40#! [GetBuildingType('building_university').GetName] buildings to #v 25#! and from #v 30%#! [concept_literacy] to #v 40%#!"
  je_british_dictate_universities_prioritize_higher_education_lose_reward_tt: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],colonial_prosperity_higher_education_tt $colonial_prosperity_higher_education$#! will no longer be a reward for completing #b $je_british_dictates$#! [concept_journal_entry]"

  je_british_dictate_universities_prioritize_public_schools: "Prioritize Public Schooling"
  je_british_dictate_universities_prioritize_public_schools_desc: "We must improve education at all levels throughout India, starting with primary and secondary schooling. A comprehensive education system will ensure a stable pipeline of our future civil servants."
  je_british_dictate_universities_prioritize_public_schools_new_goal_tt: "Our goal will shift from #v 25#! [GetBuildingType('building_university').GetName] buildings to #v 12#! and from #v 40%#! [concept_literacy] to #v 50%#!"
  je_british_dictate_universities_prioritize_public_schools_new_reward_tt: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],colonial_prosperity_public_schools_tt $colonial_prosperity_public_schools$#! becomes a #v permanent#! reward for completing #b $je_british_dictates$#! [concept_journal_entry]"
  je_british_dictate_universities_deprioritize_public_schools: "Deprioritize Public Schooling"
  je_british_dictate_universities_deprioritize_public_schools_desc: "We will deprioritize our efforts to expand Public Schooling."
  je_british_dictate_universities_prioritize_public_schools_old_goal_tt: "Our goal will shift back from #v 12#! [GetBuildingType('building_university').GetName] buildings to #v 25#! and from #v 50%#! [concept_literacy] to #v 40%#!"
  je_british_dictate_universities_prioritize_public_schools_lose_reward_tt: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],colonial_prosperity_public_schools_tt $colonial_prosperity_public_schools$#! will no longer be a reward for completing #b $je_british_dictates$#! [concept_journal_entry]"

