  je_india_home_rule_reason_request_reforms: "The Indian Administration will also be given opportunities to request #tooltippable;tooltip:[GetPlayer.GetTooltipTag],indian_democratic_reforms_tt reforms#! from its [concept_overlord], which will temporarily appease the $movement_india_pan_national$."
  je_india_home_rule_reason_remainder_home_rule: "$je_india_home_rule_reason_request_reforms$ Once Indian Nationalism has reached #b 500#! and the proper reforms have been enacted, the colonial administration can petition its overlord to enact #b sovereign home rule#! for India.\n\n@warning! If the colonial government or its overlord take #v 3#! or more #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_india_home_rule_hostile_actions_tt hostile actions#! against the $movement_india_pan_national$, the movement will shifts its goal from sovereign home rule within the overlord's empire to full independence from their colonial masters.\n$TOOLTIP_DELIMITER$\n#lore Across India, national consciousness is rising amongst the native population. Native Indians educated in foreign schools and employed by the colonial government have begun to agitate for equal status within imperial institutions, greater economic opportunity, and the eventual establishment of home rule for all of India.#!"
  je_india_home_rule_reason_remainder_full_independence: "$je_india_home_rule_reason_request_reforms$ Once Indian Nationalism has reached #b 500#!, the $movement_india_pan_national$ can issue its demand for independence and national self-governance.\n$TOOLTIP_DELIMITER$\n#lore With growing frustration towards their overlord's obstinance and the treatment of its Indian subjects, leaders of the $movement_india_pan_national$ now seek a new objective: full independence from their colonial masters and freedom and self-government for all of India!#!"
  je_india_home_rule_reason_remainder_self_government: "Once Indian Nationalism has reached #b 500#!, the $movement_india_pan_national$ can issue its demand for sovereign self-government.\n$TOOLTIP_DELIMITER$\n#lore Though India is technically free of its former master, its government, laws, and institutions are still dominated by and favored towards its non-native population. The $movement_india_pan_national$ fights onward for true self-determination and freedom for India!"

  je_india_home_rule_not_started_status: "An #b Indian#! sovereignty movement is yet to emerge."
  je_india_home_rule_home_rule_status: "The [SCOPE.sPoliticalMovement('indian_national_movement').GetNameNoIcon] is seeking sovereign home rule within the [SCOPE.sCountry('india_scope').GetOverlord.GetAdjectiveNoFlag] Empire."
