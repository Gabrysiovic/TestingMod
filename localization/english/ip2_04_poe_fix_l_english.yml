  india_events.12.d_exile:  "[SCOPE.sCharacter('besant_scope').GetFullName], a former socialist activist turned Theosophist, has announced her intention to depart for India. She will soon join her Theosophist colleagues at their headquarters in [SCOPE.sState('madras_state').GetName]."

  india_events.13.d_no_annie: "Members of the Theosophical Society in [SCOPE.sState('madras_state').GetName] have declared the young [SCOPE.sCharacter('krishnamurti_scope').GetFullName] to be the likely future vessel of the divine entity Lord Maitreya. Theosophist activists seek to adopt the boy."

