  colonial_prosperity_higher_education: "Colonial Prosperity - Higher Education"
  colonial_prosperity_higher_education_tt: "[GetStaticModifier('colonial_prosperity_higher_education').GetName|v]\n[GetStaticModifier('colonial_prosperity_higher_education').GetDesc]"
