  add_small_heritage_trait_group_radicals_tt: "[SCOPE.ScriptValue('small_radicals')|-=1%] of [Concept('concept_pop', '$concept_pops$')] in [ROOT.GetCountry.GetNameNoFlag] sharing a [concept_discrimination_trait_group] with one of our [Concept('concept_primary_cultures', '$concept_primary_cultures$')] become more [concept_radical]"
  add_medium_heritage_trait_group_radicals_tt: "[SCOPE.ScriptValue('medium_radicals')|-=1%] of [Concept('concept_pop', '$concept_pops$')] in [ROOT.GetCountry.GetNameNoFlag] sharing a [concept_discrimination_trait_group] with one of our [Concept('concept_primary_cultures', '$concept_primary_cultures$')] become more [concept_radical]"
