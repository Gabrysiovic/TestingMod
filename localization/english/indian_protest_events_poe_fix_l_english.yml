l_english:
  increase_peaceful_protest_action_tt: "The number of #b Peaceful Protest#! actions for #b The Non-Cooperation Movement#! [concept_journal_entry] increases by #v 1#"
  increase_violent_protest_action_tt: "The number of #b Violent Protest#! actions for #b The Non-Cooperation Movement#! [concept_journal_entry] increases by #v 1#"

  india_protest.2.t: "Farmers on Strike"
  india_protest.2.d: "Forced to grow cash crops for little pay under the [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting]-enforced Tinkathia System, farmers in [SCOPE.sState('farmer_strike_state').GetName] and other states have begun to protest. Seizing the momentum, leaders of the [SCOPE.sPoliticalMovement('indian_independence_movement').GetName] have organized a full strike to protest [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFlag] rule."
  india_protest.2.f: ""Do they think an economy can suffice on rice alone? [SCOPE.sGoods('dye_scope').GetName], [SCOPE.sGoods('fabric_scope').GetName], [SCOPE.sGoods('opium_scope').GetName] - these are the goods that fuel an empire!""
  india_protest.2.a: "Hopefully it's nothing too serious."
  india_protest.2.b: "The law is the law. Get those farmers back to work."
  indian_farmers_on_strike: "Farmers on Strike"

  india_protest.3.t: "Civil Servants Resign"
  india_protest.3.d: "In [SCOPE.sState('civil_servants_state_scope').GetName] and other states, [GetPopType('bureaucrats').GetName] and [GetPopType('clerks').GetName] have resigned from their posts in [GetBuildingType('building_government_administration').GetName] buildings, protesting policies of the colonial administration. Paperwork is starting to pile up!"
  india_protest.3.f: ""I told Ankur that if he didn't like the government's stance on the issue, he could simply resign. The next thing I knew the entire department was gone.""
  india_protest.3.a: "How do they expect us to get any work done?"
  india_protest.3.b: "Those remaining will just have to work twice as hard."
  civil_servants_resign: "Civil Servants Resign"

  india_protest.4.t: "Tax Protest"
  india_protest.4.d: "The [SCOPE.sPoliticalMovement('indian_independence_movement').GetName] is leading the people of [SCOPE.sState('tax_protest_state').GetName] and other states in a Tax Protest. Protesting their treatment by the colonial government, the participants are refusing to pay their taxes."
  india_protest.4.f: ""Their government wishes to treat us with less rights and privileges. Fine, I say. We shall treat them with less taxes.""
  india_protest.4.a: "I hope we can still afford the parade this year."
  india_protest.4.b: "If they won't pay their taxes then seize their property."
  indian_tax_protest: "Tax Protest"

  india_protest.5.t_civil_disobedience: "Civil Disobedience"
  india_protest.5.t_prati_sarkar: "Prati Sarkar"
  india_protest.5.d_civil_disobedience: "Native Indians across the [ROOT.GetCountry.GetName] are peacefully protesting [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] rule. Protesters are engaging in civil disobdience and disobeying laws they consider unjust, putting a strain on police resources across the country."
  india_protest.5.d_prati_sarkar: "In acts of protest against [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] rule, figures in the [SCOPE.sPoliticalMovement('indian_independence_movement').GetName] are encouraging local leaders to form their own parallel institutions. With separate schools, courts, and hospitals being ran by local Indian shadow governments, the [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] bureaucracy is having trouble keeping everything in order."
  india_protest.5.f_civil_disobedience: ""If they think they can win sovereignty through marches and protests, they best think again.""
  india_protest.5.f_prati_sarkar: ""The Indians want to play pretend at their own government. It wouldn't be such a problem if not for the headache it's causing our civil administration.""
  india_protest.5.a_civil_disobedience: "Surely we can't arrest all of them?"
  india_protest.5.a_prati_sarkar: "It's getting hard to keep track of everything."
  india_protest.5.b_civil_disobedience: "It's not our problem if the jails become overcrowded."
  india_protest.5.b_prati_sarkar: "Put an end to this ridiculous charade."
  indian_civil_disobedience: "Civil Disobedience"
  prati_sarkar_schools: "Parallel Schools"
  prati_sarkar_health_system: "Parallel Health System"

  india_protest.6.t: "Calls for Ahimsa"
  india_protest.6.d: "With [Concept('concept_activism','$concept_activism_short$')] rising within the [SCOPE.sPoliticalMovement('indian_independence_movement').GetName], some leaders have spoken out. They call for Ahimsa, peaceful protest and a rejection of violence within the movement."
  india_protest.6.f: ""A country won through violent means is a country already lost.""
  india_protest.6.a: "Let's hope they heed the call."
  india_protest.6.b: "It may be too late for this."
  ahimsa_accepted: "Calls for Ahimsa Accepted"
  ahimsa_rejected: "Calls for Ahimsa Rejected"

  nonviolence_heeded: "Calls for Nonviolence Heeded"

  india_protest.7.t: "Riots in [SCOPE.sState('riot_state').GetNameNoFormatting]"
  india_protest.7.d: "Protests within the [SCOPE.sPoliticalMovement('indian_independence_movement').GetName] have turned violent with riots breaking out in [SCOPE.sState('riot_state').GetName] and other states. [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] authorities have been quick to arrest the perpetrators, but tensions remain high."
  india_protest.7.f: ""By the time they'd finished, glass and rubble paved the streets of my beloved city. My father, an innocent bystander caught by the mob's violence, was suffering a slow recovery. I prayed, both for him and my country.""
  india_protest.7.a: "This is not the right way to do things."
  indian_riots: "Riots"

  india_protest.8.t: "Armory Raids"
  india_protest.8.d: "Violent elements within the [SCOPE.sPoliticalMovement('indian_independence_movement').GetName] have raided local armories in [SCOPE.sState('armory_raid_state').GetName] and other states. Locally stationed garrisons have been forced to requisition supplies from other sources while they hunt down the perpetrators."
  india_protest.8.f: ""The guns, the ammunition, all of it gone. How's a soldier to do his job without the means to do it?""
  india_protest.8.a: "Is this truly how they want to get their point across?"
  indian_armory_raids: "Armory Raids"

  india_protest.9.t: "Peasant Revolt"
  india_protest.9.d: "Across [GetBuildingType('building_subsistence_farm').GetName] in [SCOPE.sState('peasant_revolt_state').GetName] and other states, [GetPopType('peasants').GetName] have risen up in violent revolt against their [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] masters. Authorities are working to put down the rebellion, but tensions remain high."
  india_protest.9.f: "It was far from just a protest. Mobs of farm laborers descended on the manor houses, demanded better treatment and threatening violence to get it."
  india_protest.9.a: "Cooler heads must prevail."

  india_protest.10.t: "Assassination Attempt"
  india_protest.10.d: "Extremists within the [SCOPE.sPoliticalMovement('indian_independence_movement').GetName] have hatched a plot to assassinate [SCOPE.sCharacter('victim_scope').GetFullName]."
  india_protest.10.d1: "$india_protest.10.d$ Thankfully the victim was unharmed and has been escorted to safety."
  india_protest.10.d2: "$india_protest.10.d$ Luckily the victim has escaped with only minor injuries."
  india_protest.10.d3: "$india_protest.10.d$ The perpetrators were swiftly subdued, but not before they had completed their gruesome mission."
  india_protest.10.f: "A shot rang out in the streets and the crowd dispersed in a panic. The target was quickly hastened into a nearby building, no one sure of his condition in the ensuing chaos."
  india_protest.10.a: "Political violence isn't going to stop the colonial administration's oppression."

  india_protest.11.t: "The [SCOPE.sState('mill_strike_state').GetCityHubName] Mill Strike"
  india_protest.11.d: "Facing inflation but stagnant wages, workers in the textile mills of [SCOPE.sState('mill_strike_state').GetCityHubName] have gone on strike, demanding higher pay. [SCOPE.sCharacter('mill_strike_leader').GetFullName] has leant [SCOPE.sCharacter('mill_strike_leader').GetHerHis] hand to the effort, helping lead the workers in organized protest."
  india_protest.11.f: ""The cost of living rises sharply and yet our wages remain the same. And now the owners want to keep our bonus for themselves. Enough is enough! Let's seem them run a mill without its workers.""
  india_protest.11.a: "No shirts, no shoes, no problem."
  indian_mill_strike_result_in_two_months_tt: "We will know the result of the strike in #v two months#!."
  indian_mill_strike: "Mill Strike"

  india_protest.12.t1: "Mill Strike Success!"
  india_protest.12.t2: "Mill Strike Unsuccessful"
  india_protest.12.d1: "Mill owners in [SCOPE.sState('mill_strike_state').GetCityHubName] have caved to the demands of the workers. A pay increase will be instituted immediately so long as the workers return to work. This marks a resounding success for the mills' workers and for the [SCOPE.sPoliticalMovement('indian_national_movement').GetName]."
  india_protest.12.d2: "The strike in [SCOPE.sState('mill_strike_state').GetCityHubName] has proven unsuccessful. The mills' owners have refused to institute the desired wage increases, and some fear the effort is at a standstill."
  india_protest.12.f1: ""Together we have shown the power of unity, solidarity, and organized protest action. This is a great day for workers in India.""
  india_protest.12.f2: ""If they think this is over, if they think we will simply abide this unfair treatment, then they could not be more wrong.""
  india_protest.12.a: "Is this a sign of more to come?"
  india_protest.12.b: "The strike will continue as long as is necessary."
  india_protest.12.c: "Best they get back to work then."
  indian_mill_strike_continues_tt: "The [GetStaticModifier('indian_mill_strike').GetName|v] modifier in [SCOPE.sState('mill_strike_state').GetName] will continue for another #v two years#!"
  indian_mill_strike_successful: "Mill Strike Successful"
  modifier_indian_mill_strike_leader: "Mill Strike Leader"

  india_protest.13.t: "The [SCOPE.sState('farm_tax_protest_state').GetFarmHubName] Satyagraha"
  india_protest.13.d: "[ROOT.GetCountry.GetAdjectiveNoFormatting] tax collectors have demanded local farmers continue to pay the full amount. An organized tax protest has broken out amongst the farmers, with [SCOPE.sCharacter('farm_tax_protest_leader').GetFullName] joining to help lead the effort."
  india_protest.13.d1: "Despite the ongoing [Concept('concept_famine','famine')] in [SCOPE.sState('farm_tax_protest_state').GetFarmHubName], $india_protest.13.d$"
  india_protest.13.d2: "Despite the ongoing [GetHarvestConditionType('disease_outbreak').GetName] in [SCOPE.sState('farm_tax_protest_state').GetFarmHubName], $india_protest.13.d$"
  india_protest.13.d3: "Despite the ongoing [GetHarvestConditionType('drought').GetName] in [SCOPE.sState('farm_tax_protest_state').GetFarmHubName], $india_protest.13.d$"
  india_protest.13.f: ""There's hardly enough left for us to feed ourselves and our families, and yet all these [ROOT.GetCountry.GetAdjectiveNoFormatting] vultures can think of is taxes? Have they no hearts? Have they no families of their own?""
  india_protest.13.a: "But everyone has to pay their taxes..."
  indian_farm_tax_protest_result_in_two_months_tt: "We will know the result of the tax protest in #v two months#!."
  indian_farm_tax_protest: "Farmers Tax Protest"

  india_protest.14.t1: "Successful Satyagraha"
  india_protest.14.t2: "Unsuccessful Protest"
  india_protest.14.d1: "An agreement has been reached in [SCOPE.sState('farm_tax_protest_state').GetFarmHubName]. Tax collectors have agreed to reduce payments until the community has been given time to recover. Farmers and the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] are calling this a major victory."
  india_protest.14.d2: "The tax protest in [SCOPE.sState('farm_tax_protest_state').GetFarmHubName] has done little to dissuade the [ROOT.GetCountry.GetAdjectiveNoFlag] tax collectors. With the local farmers unwilling to pay their dues, the government has resorted to seizing their property to make up the difference. Protest leaders are unsure of how to proceed."
  india_protest.14.f1: ""Together we have shown the power of unity, solidarity, and organized protest action. This is a great day for workers in India.""
  india_protest.14.f2: ""If they think this is over, if they think we will simply abide this unfair treatment, then they could not be more wrong.""
  india_protest.14.a: "This will be but one success of many."
  india_protest.14.b: "I don't think they'll be giving in so easily."
  india_protest.14.c: "The farmers will give in before things get worse."
  indian_farm_tax_protest_continues_tt: "The [GetStaticModifier('indian_farm_tax_protest').GetName|v] modifier in [SCOPE.sState('farm_tax_protest_state').GetName] will continue for another #v two years#!"
  indian_farm_tax_protest_successful: "Tax Protest Successful"
  indian_farm_tax_protest_leader: "Tax Protest Leader"

  india_protest.15.t: "[SCOPE.sCharacter('overlord_heir_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('overlord_heir_scope').GetFirstNameNoFormatting] Riots"
  india_protest.15.d: "Protests have turned violent in [SCOPE.sState('prince_riot_state').GetName] after a state visit by [SCOPE.sCharacter('overlord_heir_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('overlord_heir_scope').GetFirstName], royal heir to the [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] throne. Violent clashes have broken out between native and colonial residents as rampant destruction takes hold of the state."
  india_protest.15.f: "Some leaders called for peace and non-violence, but it was too late. What had started as a protest against the visiting heir had turned into an inferno of death and destruction, and there was little we could but watch and wait until it had burned itself out."
  india_protest.15.a: "This will be the last time [SCOPE.sCharacter('overlord_heir_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('overlord_heir_scope').GetFirstNameNoFormatting] ever thinks of visiting."
  indian_royal_heir_riots: "Royal Heir Riots"
