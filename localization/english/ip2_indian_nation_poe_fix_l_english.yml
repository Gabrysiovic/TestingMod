l_english:
  indian_nation_events.1.t: "Founding of the [SCOPE.sPoliticalLobby('relevant_lobby').GetNameNoFormatting]"
  indian_nation_events.1.d: "The [SCOPE.gsInterestGroup('intelligentsia_ig').GetName] have united with the [SCOPE.gsInterestGroup('petty_bourgeoisie_ig').GetName] to form the [SCOPE.sPoliticalLobby('relevant_lobby').GetName]. The [SCOPE.sPoliticalMovement('indian_national_movement').GetName], once disparate and ununified, now has a dedicated political organization to help direct its efforts."
  indian_nation_events.1.f: "The meeting was abuzz with excitement. Their movement was young, but already there was the feeling of something greater. Men from throughout the [ROOT.GetCountry.GetNameNoFormatting] were gathered here for the first time, united in the cause of Indian self-rule."
  indian_nation_events.1.a: "We must keep an eye on this."
  indian_nation_events.1.b: "Their demands may have some merit."
  listening_to_indian_congress: "Listening to Indian Congress"

  indian_nation_events.2.t: "The Imprisonment Act"
  indian_nation_events.2.d: "With [Concept('concept_activism','$concept_activism_short$')] rising in the [SCOPE.sPoliticalMovement('indian_national_movement').GetName], the [SCOPE.gsInterestGroup('industrialists_ig').GetName] has hurriedly passed the #b Anarchial and Revolutionary Crimes Act#!, granting the government indefinite emergency powers to arrest [Concept('concept_agitator', '$concept_agitators$')] without trial or judicial review. Leaders of the [SCOPE.sPoliticalMovement('indian_national_movement').GetNameNoFormatting] are already debating how to respond."
  indian_nation_events.2.f: ""Indefinite detention? Imprisonment without trial? They treat us like terrorists in our own country. What have we done but stand up for our right to self-determination?""
  indian_nation_events.2.a: "We will protest this authoritarian act at once."
  indian_nation_events.2.b: "Perhaps it's time to reign things in."
  rowlatt_act_in_effect_tt: "Arresting [Concept('concept_agitator', '$concept_agitators$')] supporting the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] will reduce the movement's [Concept('concept_activism','$concept_activism_short$')] but increase its [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')]."
  protesting_imprisonment_act: "Protesting Imprisonment Act"
  reigning_in_radicalism: "Reigning in Radicalism"
  rowlatt_act_used_modifier: "Indian Nationalist Imprisoned"

  indian_nation_events.3.t: "Salt Protest in India"
  indian_nation_events.3.d: "Led by [SCOPE.sCharacter('prisoner_scope').GetFullName], protesters in India have marched to the shore to protest the goverment's monopoly on salt production. In an act of defiance against our rule, they plan to illegally harvest salt upon their arrival. The protest is causing unwanted international attention, and harming our overall reputation."
  indian_nation_events.3.f: ""The law is the law. If we let this go then we might as well let the whole of India go with it.""
  indian_nation_events.3.a: "Best to let the whole thing blow over. The [SCOPE.sCountry('india_scope').GetRuler.GetPrimaryRoleTitle] may take action if he so decides."
  indian_nation_events.3.b: "This is treason. Order their arrest at once!"
  salt_protest_order_arrest_tt: "We will order the [SCOPE.sCountry('india_scope').GetName] to arrest [SCOPE.sCharacter('prisoner_scope').GetFullName]."
  salt_protest_notoriety: "Salt Protest Notoriety"

  indian_nation_events.4.t: "Quit India Movement in India"
  indian_nation_events.4.d: "Led by [SCOPE.sCharacter('lead_agitator_scope').GetFullName], the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] has launched its boldest campaign yet: a mass protest to end [ROOT.GetCountry.GetAdjectiveNoFormatting] rule in #b India#! once and for all. If we don't do something, this movement may be the beginning of the end of our control of the subcontinent."
  indian_nation_events.4.f: ""This has gone on for quite long enough. We have tolerated this so-called independence movement for far too long. It's time we put these leaders where they belong - in a jail cell.""
  indian_nation_events.4.a: "This is treason. Order the arrest of every leader of the [SCOPE.sPoliticalLobby('inc_scope').GetNameNoFormatting]."
  indian_nation_events.4.b: "Perhaps Indian independence is inevitable..."
  quit_india_order_arrest_tt: "We will order [SCOPE.sCountry('india_scope').GetName] to arrest all [Concept('concept_agitator', 'agitators')] supporting the [SCOPE.sPoliticalMovement('indian_national_movement').GetName]."

  quit_india_monthly_indian_nationalism_increase_tt: "[concept_indian_nationalism] will permanently increase by #v 0.2#! per month."

  indian_nation_events.5.t: "The Quit India Movement"
  indian_nation_events.5.d1: "Led by [SCOPE.sCharacter('lead_agitator_scope').GetFullName], the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] has launched a campaign to end [ROOT.GetCountry.GetOverlord.GetAdjective] rule in #b India#! once and for all. Mass protests are being organized at an unprecedented scale as the rally cry for a free, independent India sounds louder than ever before."
  indian_nation_events.5.d2: "$indian_nation_events.5.d1$\n\nThe [ROOT.GetCountry.GetOverlord.GetAdjectiveNoFormatting] government has ordered us to arrest all involved leaders for treason, hoping this will delay the [SCOPE.sPoliticalMovement('indian_national_movement').GetNameNoFormatting]'s efforts."
  indian_nation_events.5.f: ""Now is the moment. Now is when we must push harder than ever before. The [ROOT.GetCountry.GetOverlord.GetAdjectiveNoFormatting] colonizers #italic must#! leave India, and we must show them the door.""
  indian_nation_events.5.a_overlord_arrest: "On the orders of the [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] government, arrest all involved leaders for treason."
  indian_nation_events.5.a_bic_arrest: "Arrest all involved leaders for treason."
  indian_nation_events.5.b: "There is little we can do at this point..."
  quit_india_arrests_tt: "Every [concept_agitator] supporting the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] will be arrested and #bold imprisoned#! for #v 3 years#!"
  modifier_quit_india_movement: "Quit India Movement"
  modifier_indian_independence_leaders_arrested: "Independence Leaders Arrested"

  indian_nation_events.6.t: "The [SCOPE.sPoliticalLobby('inc_scope').GetNameNoFormatting] Seeks Full Independence"
  indian_nation_events.6.d: "The [SCOPE.sPoliticalMovement('indian_national_movement').GetName] has reached a tipping point. Leaders of the [SCOPE.sPoliticalLobby('inc_scope').GetName] have released a declaration - they now seek the full independence of #b India#! from [SCOPE.sCountry('overlord_scope').GetAdjective] rule. The [SCOPE.sPoliticalLobby('inc_scope').GetNameNoFormatting] cites unjust treatment and the refusal to enact necessary reforms for the decision."
  indian_nation_events.6.f: ""No Indian can be free so long as [SCOPE.sCountry('overlord_scope').GetNameNoFormatting] lords over us. This movement will not stop until all of India is free from the grip of foreign power.""
  indian_nation_events.6.a: "Can this movement truly topple the mighty [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] Empire?"
  india_home_rule_failed_tt: "The [SCOPE.sPoliticalMovement('indian_national_movement').GetName] is now seeking full independence from [SCOPE.sCountry('overlord_scope').GetAdjective] rule."
  india_home_rule_not_accepted_tt: "The [SCOPE.sPoliticalMovement('indian_national_movement').GetName] will no longer accept sovereign home rule, and will eventually demand full independence from the [ROOT.GetCountry.GetAdjective] Empire."

  indian_nation_events.7.t: "The Partition of India"
  indian_nation_events.7.d: "With tensions between [GetReligion('hindu').GetNameNoIcon] and [GetReligion('sunni').GetReligiousTraitsDesc] indians irreconcilable, the government has acted on its promise to partition #b India#! into separate nations for the two peoples. [SCOPE.sCountry('pakistan_scope').GetName] has been born from the $muslim$-majority areas in the west and east, while [ROOT.GetCountry.GetName] will remain for the $hindu$ population."
  indian_nation_events.7.f: "This had been his family's home for many generations, but no longer. Amar had packed up his family and every precious belonging, and so they had begun the long trek to their new home. It was hardly his choice; how could he hope to stay when his neighbors looked at him so, when the government officers leered at him and made him feel unwelcome? And this was just the beginning. No, there was no choice. They had to leave. A brighter future lay ahead... surely..."
  indian_nation_events.7.a: "[ROOT.GetCountry.GetDefinition.GetName] will remain strong."
  indian_nation_events.7.b: "A new day for [SCOPE.sCountry('pakistan_scope').GetNameNoFormatting]."
  pakistan_is_created_tt: "#b India#! has been partitioned into [ROOT.GetCountry.GetName] and [SCOPE.sCountry('pakistan_scope').GetName]."
  muslim_characters_move_to_pakistan_tt: "All [GetReligion('sunni').GetReligiousTraitsDesc] [Concept('concept_character', 'characters')] have moved to [SCOPE.sCountry('pakistan_scope').GetName]."
  transfer_subjects_to_pakistan_tt: "All of our [concept_princely_state] [Concept('concept_subject', '$concept_subjects$')] with [Concept('concept_capital_state', 'capitals')] in [SCOPE.sCountry('pakistan_scope').GetAdjective] territory have been transferred to [SCOPE.sCountry('pakistan_scope').GetNameNoFormatting]."
  partition_migration_tt: "Millions of [GetReligion('hindu').GetNameNoIcon], [GetReligion('sikh').GetNameNoIcon], and [GetReligion('sunni').GetReligiousTraitsDesc] indians will migrate between the two countries. Many will die along the way."

  indian_nation_events.8.t: "Signs of Division"
  indian_nation_events.8.d: "Looking to protect the interests of [GetReligion('sunni').GetReligiousTraitsDesc] Indians, prominent muslims within the [ROOT.GetCountry.GetName] have founded the [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoIcon] as a means of political representation. Fearing muslim favoritism, [GetReligion('hindu').GetNameNoIcon] leaders have responded by founding the [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoIcon] to advance their own interests.\n\nWith [concept_indian_nationalism] continuing to grow, some are already putting forth a Two-Nation Theory, believing that hindus and muslims cannot co-exist within a sovereign India."
  indian_nation_events.8.f: ""Despite our repeated cries, the [SCOPE.sPoliticalLobby('inc_scope').GetNameNoFormatting] continues to ignore our concerns. If they will not listen, then we must look out for ourselves.""
  indian_nation_events.8.a: "This may be just the beginning..."
  indian_religious_nationalist_movements_founded_tt: "The [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoIcon] and [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoIcon] [Concept('concept_political_movement', '$concept_political_movements_short$')] have been founded."
  indian_nationalism_increases_support_activism_of_religious_nationalist_movements_tt: "As [concept_indian_nationalism] grows, the [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')] and [Concept('concept_activism', '$concept_activism_short$')] of the religious nationalist movements will grow as well."
  indian_religious_nationalist_support_activism_triggers_communal_divides_tt: "If the [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')] and [Concept('concept_activism', '$concept_activism_short$')] of either movement grows large enough, the #b $je_communal_divides$#! [concept_journal_entry] will trigger."

  indian_nation_events.9.t: "The Headless Master"
  indian_nation_events.9.d: "Though technically free of its former overlord, #b India#! still finds itself subject to a colonialist government dominated by foreigners. Leaders of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] have vowed to continue their organized protests until equal rights and representation are made available to all Indians."
  indian_nation_events.9.f: ""Now is not the time to pause and celebrate, but instead to push harder and louder than ever before. We shall not stop until freedom reigns throughout all of India!""
  indian_nation_events.9.a: "This may have only emboldened them..."
  fight_for_indian_sovereignty_continues_tt: "The fight for #b Indian sovereignty#! continues!"
  indian_nationalism_increase_0_2_per_month_tt: "[concept_indian_nationalism] will increase by an additional #v 0.2#! per month."

  indian_nation_events.10.t: "Burmese Freedom Fighters"
  indian_nation_events.10.d_independent_burma: "With [concept_fervor] growing among our [GetCulture('burmese').GetHeritageTrait.GetName] subjects, many are organizing protests and calling for re-integration into the nation of [SCOPE.sCountry('burma_scope').GetName].\n\nThe question remains: what stance will the [SCOPE.sPoliticalLobby('inc_scope').GetName] take on the issue?"
  indian_nation_events.10.d: "With [concept_fervor] growing among our [GetCulture('burmese').GetHeritageTrait.GetName] subjects, many are organizing protests and calling for greater Burmese autonomy.\n\nThe question remains: what stance will the [SCOPE.sPoliticalLobby('inc_scope').GetName] take on the issue?"
  indian_nation_events.10.f: ""Our Burmese brethren are fighting the same battle, the same foe, against the same colonial oppressor. To oppose their efforts would be nothing short of hypocrisy.""
  indian_nation_events.10.a_burma_subject: "Burma should become a subject of any future Indian state."
  indian_nation_events.10.a: "Any burmese territory should remain a part of the future Indian state."
  indian_nation_events.10.b: "The [SCOPE.sPoliticalLobby('inc_scope').GetNameNoFormatting] supports the creation of a Burmese state subject to the nation of India."
  indian_nation_events.10.c: "The [SCOPE.sPoliticalLobby('inc_scope').GetNameNoFormatting] fully supports the efforts of the Burmese nationalists."
  indian_nation_events.10.e: "The [SCOPE.sPoliticalLobby('inc_scope').GetNameNoFormatting] supports the return of any Burmese territory to the nation of [SCOPE.sCountry('burma_scope').GetNameNoFormatting]."
  indian_burmese_territory_returned_subject_tt: "If #b India#! gains its sovereignty, all [GetCulture('burmese').GetHeritageTrait.GetName] [Concept('concept_homeland', '$concept_homelands$')] belonging to [SCOPE.sCountry('india_scope').GetName], [SCOPE.sCountry('overlord_scope').GetName], and their [Concept('concept_subject', '$concept_subjects$')] will be returned to [SCOPE.sCountry('burma_scope').GetName]."
  indian_burmese_territory_returned_independent_tt: "If #b India#! gains its sovereignty, all [GetCulture('burmese').GetHeritageTrait.GetName] [Concept('concept_homeland', '$concept_homelands$')] belonging to [SCOPE.sCountry('india_scope').GetName] and its [Concept('concept_subject', '$concept_subjects$')] will be returned to [SCOPE.sCountry('burma_scope').GetName]."
  indian_burma_released_subject_tt: "If #b India#! gains its sovereignty, #b $BUR$#! will be formed from all [GetCulture('burmese').GetHeritageTrait.GetName] [Concept('concept_homeland', '$concept_homelands$')] belonging to [SCOPE.sCountry('india_scope').GetName], [SCOPE.sCountry('overlord_scope').GetName], and their [Concept('concept_subject', '$concept_subjects$')]."
  indian_burma_released_independent_tt: "If #b India#! gains its sovereignty, #b $BUR$#! will be formed from all [GetCulture('burmese').GetHeritageTrait.GetName] [Concept('concept_homeland', '$concept_homelands$')] belonging to [SCOPE.sCountry('india_scope').GetName] and its [Concept('concept_subject', '$concept_subjects$')]."
  indian_burma_made_indian_dominion_tt: "If #b India#! gains its sovereignty, #b $BUR$#! will become a [Concept('concept_recognized_power', '$concept_recognized_power_short$')] [concept_dominion] of the new #b Indian#! nation."
  indian_burma_made_british_dominion_tt: "If #b India#! gains its sovereignty, #b $BUR$#! will become a [Concept('concept_recognized_power', '$concept_recognized_power_short$')] [concept_dominion] of [SCOPE.sCountry('overlord_scope').GetName]."
  indian_burma_made_independent_tt: "If #b India#! gains its sovereignty, #b $BUR$#! will become a [Concept('concept_recognized_power', '$concept_recognized_power_short$')], independent nation."
  indian_nationalism_decrease_0_3_per_month_tt: "[concept_indian_nationalism] will decrease by #red 0.3#! per month."
  indian_nationalism_decrease_0_1_per_month_tt: "[concept_indian_nationalism] will decrease by #red 0.1#! per month."
  indian_nationalism_increase_0_1_per_month_tt: "[concept_indian_nationalism] will increase by #v 0.1#! per month."

  indian_nation_events.11.d: "Within the [SCOPE.sCountry('india_scope').GetName], the [SCOPE.sPoliticalLobby('inc_scope').GetName] has issued a statement in support of local [GetCulture('burmese').GetHeritageTrait.GetName] freedom fighters. If the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] is successful in their fight for Indian sovereignty, it may better our own autonomy and territorial integrity."
  indian_nation_events.11.f: ""Have you heard? The Indians are now in support of our own fight for freedom."\n\n"Good. Let's see those colonialists take on two movements at once.""
  indian_nation_events.11.a: "An interesting development."

  indian_nation_events.12.t_home_rule: "[SCOPE.sPoliticalMovement('indian_national_movement').GetNameNoFormatting] Demands Home Rule"
  indian_nation_events.12.t_independence: "[SCOPE.sPoliticalMovement('indian_national_movement').GetNameNoFormatting] Demands Independence"
  indian_nation_events.12.t_self_governance: "[SCOPE.sPoliticalMovement('indian_national_movement').GetNameNoFormatting] Demands Home Rule"
  indian_nation_events.12.d: "[concept_indian_nationalism] has reached its apex and the calls for #b Indian sovereignty#! can no longer be ignored."
  indian_nation_events.12.d_home_rule: "$indian_nation_events.12.d$ The [SCOPE.sPoliticalMovement('indian_national_movement').GetName] is demanding we issue the [ROOT.GetCountry.GetOverlord.GetAdjective] government a petition to enact #b sovereign home rule#! for India."
  indian_nation_events.12.d_independence: "$indian_nation_events.12.d$ The [SCOPE.sPoliticalMovement('indian_national_movement').GetName] is demanding we forward to the [ROOT.GetCountry.GetOverlord.GetAdjective] government their demand for independence."
  indian_nation_events.12.d_self_governance: "$indian_nation_events.12.d$ The [SCOPE.sPoliticalMovement('indian_national_movement').GetName] is demanding we enact a sovereign, representative government for India at once."
  indian_nation_events.12.f: "The protests had grown ceaseless. The cries from the movement now filled not just the streets but it seemed all the subcontinent. "Freedom! Freedom! Freedom for India!""
  indian_nation_events.12.a: "We will give in to the movement's demands."
  indian_nation_events.12.b: "Their cries shall fall on deaf ears."

  indian_nation_events.13.t: "Sovereignty Movement in India"
  indian_nation_events.13.d: "Word arrives from our newly acquired [SCOPE.sCountry('india_scope').GetSubjectType.GetNameNoIcon] in India - the Indian natives are actively protesting for a sovereign self-government and greater autonomy. The colonial administration assures us there is little to worry about."
  indian_nation_events.13.f: ""A lot of blood and treasure was spent to bring India into the empire. The Indians best forget this whole business and remember that they are [ROOT.GetCountry.GetAdjectiveNoFormatting] subjects now.""
  indian_nation_events.13.a: "Something to keep an eye on for sure."
  added_to_indian_nation_je_tt: "We have been added to $je_india_home_rule$ [concept_journal_entry]."

  indian_nation_events.14.t: "New Master, Same Oppression"
  indian_nation_events.14.d: "Though India finds itself subject to a new foreign power, the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] remains undeterred. Leaders of the movement have vowed to continue their efforts until sovereignty and self-government is achieved."
  indian_nation_events.14.f: ""British? [ROOT.GetCountry.GetOverlord.GetAdjectiveNoFormatting]? I hardly see the difference. The only people that ought to be ruling India are Indians themselves.""
  indian_nation_events.14.a: "I suppose we should have expected as much."
  india_new_subject_tt: "#b India#! is now a [concept_subject] of [ROOT.GetCountry.GetOverlord.GetName]."

  indian_nation_events.15.d: "War has broken out in #b India#!, with the #b $movement_india_pan_national$#! taking up arms against their colonial oppressors. Should they win, not only will India be free, but we too would see our autonomy and territorial integrity affected."
  indian_nation_events.15.f: ""This is not just India's war, it is a war for all South Asian peoples to fight against colonial oppression.""
  indian_nation_events.15.a: "Godspeed, India."
  indian_nation_events.15.b: "We will take up arms to support their cause."
  join_indian_war_of_independence_tt: "We will join [SCOPE.sCountry('revolutionary_india_scope').GetName] in their war for independence."
# === FIX LINE ===
 add_indian_nationalism_button: "Add Indian Nationalism"
 add_indian_nationalism_button_desc: "Adds #v 25#! to #b Indian Nationalism#!"

 INDIAN_NATIONALISM: "[concept_indian_nationalism]"
 INDIAN_SELF_RULE: "Indian Self-Rule"

 indian_nationalism_advance_reasons_tt: "• $home_rule_progress_from_india_pan_national_movement$\n• $home_rule_progress_from_sovereignist_interest_groups$\n• Enacting #tooltippable;tooltip:[GetPlayer.GetTooltipTag],indian_democratic_reforms_tt democratic reforms#!\n• $home_rule_progress_from_reformist_overlord_interest_groups$\n• Peaceful protest events\n• Active or completed #b $je_india_swadeshi_movement$#! [concept_journal_entry]\n• Active or completed #b $je_india_non_cooperation_movement$#! [concept_journal_entry]\n• The overlord's statutory commission #b supported#! Indian sovereignty\n• $home_rule_progress_from_supporting_greater_burmese_autonomy$\n• $home_rule_progress_from_independence$"
 indian_nationalism_retreat_reasons_tt: "• $home_rule_loss_from_loyal_interest_groups$\n• $home_rule_loss_from_imperialist_overlord_interest_groups$\n• Failing #b $je_india_swadeshi_movement$#! and #b $je_india_non_cooperation_movement$#! [Concept('concept_journal_entry', '$concept_journal_entries$')]\n• The overlord's statutory commission #b rejected#! Indian sovereignty\n• $home_rule_loss_from_complicit_in_burmese_colonialism$ or $home_rule_loss_from_limiting_future_burmese_autonomy$\n• Having an active #b $default_famine_key$#! [concept_journal_entry]"
 indian_democratic_reforms_tt: "• Enacting [GetLawType('law_elected_bureaucrats').GetName]\n• Receiving permission for local [Concept('concept_election','$concept_elections$')]\n• Enacting either [GetLawType('law_multicultural').GetName] or the [GetAmendmentType('amendment_government_of_india_act').GetName] [concept_amendment]\n• Increasing [concept_autonomy] to [concept_dominion] or [concept_protectorate]"

 je_india_home_rule_hostile_actions_tt: "• #b India#!'s [concept_overlord] has rejected requests for government reforms at least #b twice#!\n• #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ig_indian_imperialist_tt Imperialist#! [Concept('concept_interest_group', '$concept_interest_groups$')] in the overlord's [concept_government] (without #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ig_indian_reformist_tt reformist#! groups to counter them) have blocked #v 30#! [concept_indian_nationalism] progress\n• The #b Imprisonment Act#! was #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_india_home_rule_imprisonment_act_conditions_tt enacted#!\n• Soldiers #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_india_home_rule_massacre_conditions_tt fired#! on protestors\n• The overlord's #b statutory commission#! has rejected #b India#!'s need for self-governance\n• #b India#!'s overlord has rejected the petition for #b sovereign home rule#!"
 je_india_home_rule_imprisonment_act_conditions_tt: "• [concept_indian_nationalism] exceeded #v 150#!\n• The [Concept('concept_activism', '$concept_activism_short$')] of the #b $movement_india_pan_national$#! exceeded #b #red 50%#!#!"
 je_india_home_rule_massacre_conditions_tt: "• The #b Imprisonment Act#! was enacted\n• The [Concept('concept_activism', '$concept_activism_short$')] of the #b $movement_india_pan_national$#! exceeded #b #red 65%#!#!"

 modifier_india_company_rule_upgrade_tt: "[GetStaticModifier('modifier_india_company_rule_upgraded').GetName|v]\n[GetStaticModifier('modifier_india_company_rule_upgraded').GetDesc]"

 je_india_home_rule_petition_home_rule: "Petition for Home Rule"
 india_petition_home_rule_tt: "We will give in to the demands of the [SCOPE.sPoliticalMovement('indian_national_movement').GetNameNoFormatting] and petition [SCOPE.sCountry('india_scope').GetOverlord.GetNameNoFormatting] for #b sovereign home rule#! within the [SCOPE.sCountry('india_scope').GetOverlord.GetAdjectiveNoFormatting] Empire."
 je_india_home_rule_petition_home_rule_desc: "$india_petition_home_rule_tt$\n\n[SCOPE.sCountry('india_scope').GetOverlord.GetNameNoFlag] will be more likely to accept if the combined [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')] and [Concept('concept_activism', '$concept_activism_short$')] of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] exceeds #v 70%#!. A #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ig_indian_reformist_tt reformist#! [SCOPE.sCountry('india_scope').GetOverlord.GetAdjectiveNoFormatting] government will also be more likely to accept, while an #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ig_indian_imperialist_tt imperialist#! one will be less likely.\n\nIf [SCOPE.sCountry('india_scope').GetOverlord.GetNameNoFormatting] refuses, it will greatly increase the number of native Indian [Concept('concept_radical', 'radicals')], the disapproval of the #b $lobby_indian_national_congress_icon$ $lobby_indian_national_congress_name$#!, and the [Concept('concept_activism', '$concept_activism_short$')] of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName]."
 je_india_home_rule_demand_independence: "Demand Full Independence"
 india_demand_independence_tt: "The [SCOPE.sPoliticalMovement('indian_national_movement').GetNameNoFormatting] will issue a demand to [SCOPE.sCountry('india_scope').GetOverlord.GetNameNoFormatting] for #b full independence#! and a sovereign government."
 je_india_home_rule_demand_independence_desc: "$india_demand_independence_tt$\n\n[SCOPE.sCountry('india_scope').GetOverlord.GetNameNoFlag] will be more likely to accept depending on how many #tooltippable;tooltip:[GetPlayer.GetTooltipTag],indian_democratic_reforms_tt reforms#! we have passed and if the combined [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')] and [Concept('concept_activism', '$concept_activism_short$')] of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] exceeds #v 70%#!. A #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ig_indian_reformist_tt reformist#! [SCOPE.sCountry('india_scope').GetOverlord.GetAdjectiveNoFormatting] government will also be more likely to accept, while an #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ig_indian_imperialist_tt imperialist#! one will be less likely.\n\nIf [SCOPE.sCountry('india_scope').GetOverlord.GetNameNoFormatting] refuses, it will vastly increase the number of native Indian [Concept('concept_radical', 'radicals')], the disapproval of the #b $lobby_indian_national_congress_icon$ $lobby_indian_national_congress_name$#!, and the [Concept('concept_activism', '$concept_activism_short$')] of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName]."
 je_india_home_rule_sovereign_government: "Enact Self-Government"
 india_enact_sovereign_government_tt: "We will enact sovereign self-governance for all of #b India#!, completing #b $je_india_home_rule$#! [concept_journal_entry]."
 je_india_home_rule_sovereign_government_desc: "The governmental body of #b India#! shall be re-organized, finally allowing for a sovereign, representative government that serves #b all#! of India's people."

 je_india_enact_home_rule: "Enact Indian Home Rule"
 je_india_enact_home_rule_desc: "To preserve our dominion over India we will enact sovereign home rule for its people. The Indian adminsitration shall be reformed as a sovereign, representative government that can charter its own destiny within the bounds of the [ROOT.GetCountry.GetAdjectiveNoFormatting] Empire."

