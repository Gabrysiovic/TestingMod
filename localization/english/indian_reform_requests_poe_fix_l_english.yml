l_english:
  indian_reform_request_events.1.t: "Requesting Government Reform"
  indian_reform_request_events.1.d: "Facing pressure from the [SCOPE.sPoliticalMovement('indian_national_movement').GetName], our administration has decided to request [ROOT.GetCountry.GetOverlord.GetName]'s permission to enact a reform to appease the movement's members."
  indian_reform_request_events.1.f: "The radicalism of the growing Indian movement cannot be denied. We need to offer some form of appeasement or we risk losing the entire subcontinent. Let's hope [ROOT.GetCountry.GetOverlord.GetNameNoFormatting] sees things the same way."
  indian_reform_request_events.1.a: "We will request the enactment of [GetLawType('law_elected_bureaucrats').GetName]."
  indian_reform_request_events.1.b: "We will request permission to allow the Indian people to elect their own representatives."
  indian_reform_request_events.1.c: "We will request passage of the [GetAmendmentType('amendment_government_of_india_act').GetName] [concept_amendment]."
  indian_reform_request_events.1.e: "We will request the reorganization of the [SCOPE.sCountry('india_scope').GetNameNoFormatting] into a [concept_dominion]."

  indian_reform_request_events.2.t: "Indian Administration Requests Elected Bureaucrats"
  indian_reform_request_events.2.d: "Facing pressure from the [SCOPE.sPoliticalMovement('indian_national_movement').GetName], the [SCOPE.sCountry('india_scope').GetName] has requested permission to immediately enact [GetLawType('law_elected_bureaucrats').GetName]. Such a move would allow the native Indians to elect their own government administrators and appease some of the movement's more radical members."
  indian_reform_request_events.2.f: ""Governance is no simple business. What makes the Indians think they are capable?""
  indian_reform_request_events.2.a: "We see no reason to change the status quo."
  indian_reform_request_events.2.b: "If it will settle them down, then we will permit the [SCOPE.sCountry('india_scope').GetNameNoFormatting] to immediately enact [GetLawType('law_elected_bureaucrats').GetNameNoFormatting]."

  indian_reform_request_events.3.t: "Indian Administration Requests Greater Indian Representation"
  indian_reform_request_events.3.d: "Facing pressure from the [SCOPE.sPoliticalMovement('indian_national_movement').GetName], the [SCOPE.sCountry('india_scope').GetName] has requested permission to pass the [GetAmendmentType('amendment_government_of_india_act').GetName] [concept_amendment]. Such a move would grant greater rights and representation to its native Indian populace and appease some of the movement's more radical members."
  indian_reform_request_events.3.f: ""Greater representation? I suppose next they'll be asking for full independence.""
  indian_reform_request_events.3.a: "We see no reason to change the status quo."
  indian_reform_request_events.3.b: "If it will settle them down, then we will permit the [SCOPE.sCountry('india_scope').GetNameNoFormatting] to immediately pass the amendment."

  indian_reform_request_events.4.t: "Indian Administration Requests Dominion Status"
  indian_reform_request_events.4.d: "Facing pressure from the [SCOPE.sPoliticalMovement('indian_national_movement').GetName], the government of [SCOPE.sCountry('india_scope').GetName] has requested permission to be re-organized into a proper [concept_dominion]. Such a move would appease some of the movement's more radical members."
  indian_reform_request_events.4.f: ""A Dominion? Perhaps the Indian people forget who is the empire and who is the colony.""
  indian_reform_request_events.4.a: "We see no reason to change the [SCOPE.sCountry('india_scope').GetNameNoFormatting]'s subject status."
  indian_reform_request_events.4.b: "If it will settle them down, then the [SCOPE.sCountry('india_scope').GetNameNoFormatting] will be re-organized into a $concept_dominion$."

  indian_reform_request_events.5.t: "[SCOPE.sPoliticalMovement('indian_national_movement').GetNameNoFormatting] Petitions for Home Rule"
  indian_reform_request_events.5.d: "The swell of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] has reached a tipping point. They have petitioned our government for #b sovereign home rule#! of #b India#! and the right to self-government as a dominion within the [ROOT.GetCountry.GetAdjectiveNoFormatting] Empire."
  indian_reform_request_events.5.f: ""Home Rule - the abdication of our governance of India to the natives. It's unthinkable."\n\n"Yes, but if it's between this or losing the subcontinent entirely, then perhaps we've simply no choice. And if it will finally end their squawking for sovereignty, all the better.""
  indian_reform_request_events.5.a: "India is and will forever remain a [ROOT.GetCountry.GetAdjectiveNoFormatting] colony!"
  indian_reform_request_events.5.b: "Send the word. India shall be re-organized into a dominion with sovereign home rule for the native population."
  india_granted_home_rule_tt: "#b India#! will be granted sovereign home rule as a [concept_dominion] within the [ROOT.GetCountry.GetAdjective] Empire."
  notification_overlord_home_rule_denied_name: "Home Rule Denied"
  notification_overlord_home_rule_denied_desc: "[SCOPE.sCountry('overlord_scope').GetName] has denied the petition for sovereign home rule. This has greatly increased the number of native Indian [concept_radicals], the disapproval of the [SCOPE.sPoliticalLobby('inc_scope').GetName], and the [Concept('concept_activism','$concept_activism_short$')] of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName]."
  notification_overlord_home_rule_denied_tooltip: "#header $notification_overlord_home_rule_denied_name$#!\n$TOOLTIP_DELIMITER$\n$notification_overlord_home_rule_denied_desc$"

  indian_reform_request_events.6.t: "[SCOPE.sPoliticalMovement('indian_national_movement').GetNameNoFormatting] Demands Independence"
  indian_reform_request_events.6.d: "Nationalism in #b India#! has reached its apex. Leaders of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] have contacted our government offices, demanding self-government and full independence from the [ROOT.GetCountry.GetAdjectiveNoFormatting] Empire."
  indian_reform_request_events.6.f: "Decades of nationalist agitation had all come to this, and the message was clear as day: India would be either free of [ROOT.GetCountry.GetAdjectiveNoFormatting] rule or completely ungovernable. Regardless of which path we chose, one thing was clear: this once-little problem was not going away."
  indian_reform_request_events.6.a: "[ROOT.GetCountry.GetNameNoFormatting] will never relinquish its hold on India!"
  indian_reform_request_events.6.b: "We're left with little choice. If they want their independence, then they shall have it."
  india_granted_independence_tt: "#b India#! will be granted full independence with a sovereign government."
  notification_overlord_independence_denied_name: "Indian Independence Denied"
  notification_overlord_independence_denied_desc: "[SCOPE.sCountry('overlord_scope').GetName] has denied the [SCOPE.sPoliticalMovement('indian_national_movement').GetName]'s demand for full independence. This has greatly increased the number of native Indian [concept_radicals], the disapproval of the [SCOPE.sPoliticalLobby('inc_scope').GetName], and the [Concept('concept_activism','$concept_activism_short$')] of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName]."
  notification_overlord_independence_denied_tooltip: "#header $notification_overlord_independence_denied_name$#!\n$TOOLTIP_DELIMITER$\n$notification_overlord_independence_denied_desc$"

  indian_reform_request_events.7.t: "Authorizing Government Reform"
  indian_reform_request_events.7.d: "It has been decided that we will authorize a democratic reform in the [SCOPE.sCountry('india_scope').GetName]. Doing so will advance the goals of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] towards a sovereign India and temporarily appease its more radical elements."
  indian_reform_request_events.7.f: ""It isn't as if we have much choice in the matter, what with the way that movement is riling up the whole of India. A reform here, a council seat there; keep them happy and it'll keep the disruptions to a minimum.""
  indian_reform_request_events.7.a: "We will authorize the enactment of [GetLawType('law_elected_bureaucrats').GetName]."
  indian_reform_request_events.7.b: "We will grant permission to allow the Indian people to elect their own representatives."
  indian_reform_request_events.7.c: "We will authorize passage of the [GetAmendmentType('amendment_government_of_india_act').GetName] [concept_amendment]."
  indian_reform_request_events.7.e: "We will authorize the reorganization of the [SCOPE.sCountry('india_scope').GetNameNoFormatting] into a [concept_dominion]."

  approved_indian_government_reform_good: "Approved Indian Government Reform"
  approved_indian_government_reform_bad: "Approved Indian Government Reform"
  rejected_indian_government_reform_good: "Rejected Indian Government Reform"
  rejected_indian_government_reform_bad: "Rejected Indian Government Reform"
  approved_indian_sovereignty_good: "Approved Indian Sovereignty"
  approved_indian_sovereignty_bad: "Approved Indian Sovereignty"
  rejected_indian_sovereignty_good: "Rejected Indian Sovereignty"
  rejected_indian_sovereignty_bad: "Rejected Indian Sovereignty"

  indian_reform_accepted: "Reform Accepted"
  indian_reform_denied: "Reform Denied"
  indian_sovereignty_denied: "Sovereignty Denied"
