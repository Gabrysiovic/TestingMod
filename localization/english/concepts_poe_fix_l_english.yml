l_english:
 concept_indian_nationalism: "Indian Nationalism"
 concept_indian_nationalism_desc: "Indian Nationalism represents the progress of the $movement_india_pan_national$'s efforts to achieve sovereign self-government for India. It is tracked with #b $je_india_home_rule$#! [concept_journal_entry], and will trigger various events and $concept_journal_entries$ as it reaches certain thresholds.\n\nVarious factors will #tooltippable;tooltip:[GetPlayer.GetTooltipTag],indian_nationalism_advance_reasons_tt advance#! and #tooltippable;tooltip:[GetPlayer.GetTooltipTag],indian_nationalism_retreat_reasons_tt retreat#! Indian Nationalism. As it grows, there will be an increasing chance for $BIC$ to receive yearly protest events. Peaceful protest events will occur when the [Concept('concept_activism','$concept_activism_short$')] of the $movement_india_pan_national$ is low, while violent protest events are more likely with higher activism."