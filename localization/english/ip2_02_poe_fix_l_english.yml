communal_divides_events.2.d1: "$communal_divides_events.2.d$\n\nTo quell the violence, authorities have promised eventual partition of India into separate $hindu$ and $muslim$ nations. For proponents of a united India, it is a dark day for the divided subcontinent."
communal_divides_events.2.d2: "$communal_divides_events.2.d$\n\nTo quell the violence, authorities have promised to partition India into separate $hindu$ and $muslim$ nations. For proponents of a united India, it is a dark day for the divided subcontinent."
