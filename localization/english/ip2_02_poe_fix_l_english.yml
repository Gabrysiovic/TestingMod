l_english:
sepoy_mutiny_events.2.g: "Leave the Princes to the mess they've created."
overlord_annexes_non_indian_states_tt: "[ROOT.GetCountry.GetOverlord.GetName] will annex all of our [Concept('concept_state', '$concept_states$')] outside of [GetGeographicRegion('geographic_region_india').GetName]."

sepoy_mutiny_begins_tt: "#b $je_sepoy_mutiny$#! has begun."

sepoy_mutiny_events.4.t_mug: "Rise, My Emperor"
sepoy_mutiny_events.4.t_instigator: "The Rebellion Begins"
sepoy_mutiny_events.4.d_mug: "Rebellion against colonial rule has broken out across India. In the north, soldiers are proclaiming [ROOT.GetCountry.GetRuler.GetFullName] as rightful Emperor of India, demanding he take his place as leader of the rebellion."
sepoy_mutiny_events.4.d_instigator: "Everything has fallen into place. A mutiny of sepoys has sparked a wider rebellion across all of India to expel the [SCOPE.sCountry('eic_scope').GetName] once and for all.\n\nWe now join forces with Sepoy and [concept_princely_state] alike, fighting to restore India to native, princely rule and end the [SCOPE.sCountry('eic_overlord_scope').GetAdjectiveNoFormatting] reign for good."
sepoy_mutiny_events.4.f_mug: "#lore "As long as there remains the scent of Iman in the hearts of our Ghazis, so long shall the sword of Hindustan flash before the throne of [ROOT.GetCountry.GetTopOverlord.GetCapital.GetCityHubName]."#!"
sepoy_mutiny_events.4.f_instigator: ""This is it, everything we've been working for. Strike now, with fire in your heart, to forever rid us of the [SCOPE.sCountry('eic_overlord_scope').GetAdjectiveNoFormatting] menace.""
sepoy_mutiny_events.4.a_mug: "Doomed or destined, [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting] will lead the rebellion."
sepoy_mutiny_events.4.e_mug: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] would rather stick to his poetry."
sepoy_mutiny_events.4.g: "Take up arms in support of the [SCOPE.sCountry('eic_scope').GetName]"
sepoy_mutiny_events.4.g_mug: "They are sorely mistaken. [ROOT.GetCountry.GetNameNoFormatting] will come to the aid of the [ROOT.GetCountry.GetOverlord.GetNameNoFormatting]."
mug_sat_princely_states_swear_fealty_tt: "Other adjacent, rebelling [Concept('concept_princely_state', '$concept_princely_states$')] may swear fealty to us and become [Concept('concept_vassal', '$concept_vassals$')]."
princely_state_joins_rebellion_tt: "We will join the rebellion to expel the [SCOPE.sCountry('eic_scope').GetName] from #b India#!, risking annexation if we fail."
princely_state_remains_neutral_tt: "We will remain neutral during the rebellion."
princely_state_sides_with_eic_tt: "We will side with [SCOPE.sCountry('eic_scope').GetName] to put down the rebellion."
after_sepoy_mutiny_reduce_subject_payments_tt: "If the #b rebellion#! is defeated, we will be rewarded for our loyalty by removing our subject payments."
no_territory_after_sepoy_mutiny_tt: "If the #b rebellion#! succeeds in expelling the colonial administration, we will not be eligible to receive additional territory."

begin_receiving_sepoy_cartridge_events_tt: "We will begin receiving events related to the introduction of the new cartridges. How we respond will affect the severity of the final impact on [concept_presidency_stability] and [Concept('concept_radical', '$concept_radicals$')] created among our [GetReligion('sunni').GetReligiousTraitsDesc] and [GetReligion('hindu').GetNameNoIcon] [GetPopType('soldiers').GetName]."
sepoy_cartridge_effect_worsened_tt: "The impact on [concept_presidency_stability] and [Concept('concept_radical', '$concept_radicals$')] will be more severe."
sepoy_cartridge_effect_lessened_tt: "The impact on [concept_presidency_stability] and [Concept('concept_radical', '$concept_radicals$')] will be lessened."

sepoy_mutiny_events.10.t_severe: "Rampant Insubordination"
sepoy_mutiny_events.10.d_severe: "Unrest over the Ensfield cartridges has gripped sepoys throughout the [ROOT.GetCountry.GetName]. Many now outright refuse to follow orders, suspecting their officers of ulterior motives."
sepoy_mutiny_events.10.f_severe: "The captain was worried. He was sure he had seen some off-duty soldiers following him as he exited the church. A tense air hung over the camp. The native regiments had been acting odd, breaking curfew, sticking together in large groups, carrying their rifles off-duty, and apparently some had refused to follow orders.\n\nHe counted the other officers in the camp. A fair number; could they hold their own if the natives rebelled? A nervous laugh escaped his mouth. No, if it came to that they would be dead before their first reload."
sepoy_mutiny_events.10.a_severe: "Agitation among the ever-loyal sepoy... unthinkable..."

sepoy_mutiny_events.12.t: "A Victorious Rebellion"
sepoy_mutiny_events.12.d: "The Indian Rebellion has succeeded, and all across our country people celebrate. No more shall [ROOT.GetCountry.GetName] be threatened by the subjugation of overseas empires. Rule of India now returns to the princes: forever changed, but perhaps forever free."
sepoy_mutiny_events.12.f: "No matter what the future may hold for India, today shall always be known as the day it took hold of its own destiny."
sepoy_mutiny_events.12.a: "India and its neighbors have emerged from the shadow of foreign colonialism."

