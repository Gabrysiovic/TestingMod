indian_businesses_destroyed_for_mosque: "Business Destroyed for Mosque Construction"

indian_gaining_local_representation: "Gaining Local Representation"
indian_no_local_representation: "No Local Representation"
indian_maintaining_grip_on_urban_administrations: "Maintaining Grip on Urban Administration"
indian_government_seized_local_administration: "Government Seized Local Administration"

communal_divides_events.7.t: "Influence of the [SCOPE.gsInterestGroup('priesthood_scope').GetNameNoFormatting]"
communal_divides_events.7.d: "Leaders of the [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoIcon] have lodged a complaint about the influence of the [SCOPE.gsInterestGroup('priesthood_scope').GetName], demanding the government diminish their influence so that [GetReligion('sunni').GetReligiousTraitsDesc] interests can also be represented.\n\nMeanwhile, the [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoIcon] is complaining that the [SCOPE.gsInterestGroup('priesthood_scope').GetNameNoFormatting] is not influential enough, and that the government is unfairly biased towards its muslim population."
communal_divides_events.7.f: ""The fact that the [SCOPE.gsInterestGroup('priesthood_scope').GetNameNoFormatting] is allowed to hold so much sway is a disgrace. This government claims to be impartial, but they say a lot of untrue things. If they want our trust they can start with actions, not words.""
communal_divides_events.7.a: "The [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoFormatting]'s concerns are valid. Restrict the influence of the [SCOPE.gsInterestGroup('priesthood_scope').GetNameNoFormatting] over our affairs."
communal_divides_events.7.b: "We have to concede to our [GetReligion('hindu').GetNameNoFormatting] population."
communal_divides_events.7.c: "As a compromise, offer both movements greater influence instead."
indian_granted_greater_influence: "Granted Greater Influence"
indian_restricted_influence: "Influence Restricted"
indian_less_influential_priesthood_good: "Less Influential Priesthood"
indian_less_influential_priesthood_bad: "Less Influential Priesthood"
indian_more_influential_priesthood_good: "More Influential Priesthood"
indian_more_influential_priesthood_bad: "More Influential PriestHood"
indian_greater_say_in_government: "Greater Say in Government"

communal_divides_events.8.t: "Preaching Tolerance"
communal_divides_events.8.d: "His sermons may increase the [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')] of the [SCOPE.sPoliticalMovement('target_movement').GetNameNoIcon], but may also decrease its [Concept('concept_activism','$concept_activism_short$')]."
communal_divides_events.8.d1: "A [GetReligion('hindu').GetNameNoIcon] priest has begun preaching tolerance and unity towards [GetReligion('sunni').GetReligiousTraitsDesc] indians. $communal_divides_events.8.d$"
communal_divides_events.8.d2: "An [GetReligion('sunni').GetReligiousTraitsDesc] imam has begun preaching tolerance and unity towards [GetReligion('hindu').GetNameNoIcon] indians. $communal_divides_events.8.d$"
communal_divides_events.8.f: ""Are we not all Indians in both spirit and flesh? Let's not let our differences divide us, but find what we have in common to unite us.""
communal_divides_events.8.a: "Stand back and let him preach."
communal_divides_events.8.b: "Arrest that fool before he gives them any ideas."
indian_preaching_tolerance: "Preaching Tolerance"
indian_religious_leader_arrested: "Religious Leader Arrested"

communal_divides_events.9.t: "His Land, My Land"
communal_divides_events.9.d: "The [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoIcon] is leading a protest for land reform in [SCOPE.sState('relevant_state').GetCityHubName], demanding that [GetReligion('sunni').GetReligiousTraitsDesc] farmers be allowed to work their own land rather than labor for [GetReligion('hindu').GetNameNoIcon] land owners. The [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoIcon] argues the land owners are well within their rights to treat their workers how they see fit."
communal_divides_events.9.f: ""I have worked this land my entire life. My father worked it, my grandfather worked it. And we did not do so for a wealthy [GetReligion('hindu').GetNameNoFormatting] to come and boss us around.""
communal_divides_events.9.a: "Property rights are property rights."
communal_divides_events.9.b: "Buy off some of the land and redistribute it to the muslim farmers."
communal_divides_events.9.c: "What if we did just a little land redistribution?"
indian_sated_by_land_redistribution: "Sated by Land Redistribution"
indian_fended_off_land_redistribution: "Fended Off Land Redistrubtion"
indian_agitating_over_land_distribution: "Agitating Over Land Redistrubtion"
indian_upset_over_land_redistribution: "Upset Over Land Redistribution"
indian_prevented_land_redistribution: "Prevented Land Redistribution"
indian_land_redistribution: "Land Redistribution"

communal_divides_events.10.t: "Corruption Scandal Hits [SCOPE.sPoliticalMovement('target_movement').GetNameNoFormatting]"
communal_divides_events.10.d: "A scandal has hit the [SCOPE.sPoliticalMovement('target_movement').GetName], with movement leaders pocketing proceeds for themselves to spend on various luxuries. The news has put a black spot on the organization, with many members questioning their future participation."
communal_divides_events.10.f: ""You don't understand. It's exhausting work. Very stressful. I need a little self-indulgence every now and then, to keep my energy up. How else can I lead us so?""
communal_divides_events.10.a: "This will certainly drive away many members."
communal_divides_events.10.b: "If we shield their leaders, they might tone down their rhetoric."
indian_scandal: "Scandal"
indian_shielded_from_scandal: "Shielded from Scandal"

communal_divides_events.11.t: "Cooperative Dialog"
communal_divides_events.11.d: "A neutral party has reached out to prominent [GetReligion('hindu').GetNameNoIcon] and [GetReligion('sunni').GetReligiousTraitsDesc] Indians for an open discussion on cooperation, shared goals, and mutual tolerance. Is there any hope for progress towards peaceful co-existence, or is this just a fool's errand?"
communal_divides_events.11.f: ""I would like to thank you all for coming. We are here today to discuss our common goals, and I hope we all leave here stronger and united by our shared love of our country and our countrymen.""
communal_divides_events.11.a: "A step in the right direction."
communal_divides_events.11.b: "If a few bad actors make a scene, it'll make them all look bad."
indian_cooperative_dialog: "Cooperative Dialog"
indian_embarassing_display: "Embarassing Display"

communal_divides_events.12.t: "Poaching Members"
communal_divides_events.12.d: "With the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] pulling members from across India, [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoIcon] and the [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoIcon] are actively trying to recruit from its ranks, targetting influential but disatisfied members."
communal_divides_events.12.f: ""It's not that I don't agree with their cause, it's just that it's not aligned well enough with ours - what's best for us and our people. Can't you agree that ours is the best way forward?""
communal_divides_events.12.a: "Try to direct members towards [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoFormatting]."
communal_divides_events.12.b: "Steer them towards the [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoFormatting]."
communal_divides_events.12.c: "Perhaps we can make the [SCOPE.sPoliticalMovement('indian_national_movement').GetNameNoFormatting] look more appealing."
indian_influx_of_members: "Influx of Members"
indian_radical_newcomers: "Radical Newcomers"
indian_moderate_newcomers: "Moderate Newcomers"
indian_losing_members: "Losing Members"

communal_divides_events.13.t: "A Common Cause"
communal_divides_events.13.d: "Members of the [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoIcon] and the [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoIcon] and have agreed to temporarily set aside their differences for the sake of advancing the Indian sovereignty movement. While the alliance may be short lived, members of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] welcome their cooperation."
communal_divides_events.13.f: ""My fellow countrymen, let us set aside our differences and unite behind the shared cause of Indian sovereignty. We have one enemy and it is not Hindu or Muslim, but [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] oppression.""
communal_divides_events.13.a: "Will they focus on advancing the nationalist cause?"
communal_divides_events.13.b: "Or mending fractured ties?"

communal_divides_events.14.t: "Communal Division"
communal_divides_events.14.d: "The division between [GetReligion('hindu').GetNameNoIcon] and [GetReligion('sunni').GetReligiousTraitsDesc] populations in #b India#! has reached a boiling point, with [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')] and [Concept('concept_activism','$concept_activism_short$')] swelling in the [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoIcon] and [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoIcon] [Concept('concept_political_movement', '$concept_political_movements$')]. If the two sides cannot set aside their differences and learn to coexist, authorities may be forced to answer separatist calls by creating individual countries for both factions."
communal_divides_events.14.f: ""How can a country stand united when its divisions stand so clear? India has always been a land of myriad peoples, but can we stand together despite our differences or will we fracture because of them?""
communal_divides_events.14.a: "The fate of India hangs in the balance."
communal_divides_activated_tt: "The #b $je_communal_divides$#! [concept_journal_entry] has been activated."
communal_unity_split_pre_homerule_tt: "If #b $hindu$#! or #b $muslim$#! #b #red Separatism#!#! reaches #v #red 100%#!#!, #b India#! will be split into separate [GetReligion('hindu').GetNameNoIcon] and [GetReligion('sunni').GetReligiousTraitsDesc] countries if and when it gains #b sovereign self-rule#!."
communal_unity_split_post_homerule_tt: "If #b $hindu$#! or #b $muslim$#! #b #red Separatism#!#! reaches #v #red 100%#!#!, #b India#! will be split into separate [GetReligion('hindu').GetNameNoIcon] and [GetReligion('sunni').GetReligiousTraitsDesc] countries"

communal_divides_events.15.t: "The Federal Solution"
communal_divides_events.15.d: "With separatism and religious nationalism threatening to tear the country apart, [GetReligion('hindu').GetNameNoIcon] and [GetReligion('sunni').GetReligiousTraitsDesc] leaders have finally reached a compromise. Semi-autonomous $muslim$ nations will be created in the East and West, subject to the [ROOT.GetCountry.GetName] under a confederal system.\n\nWhile many [GetReligion('hindu').GetNameNoFormatting] leaders oppose the decision, others believe it a necessary compromise to avoid a complete fracture into separate, autonomous states."
communal_divides_events.15.f: "No one seemed happy with the solution. But then again no one seemed unhappy with it either. There was a sort of begrudging acceptance among all that while perhaps this was not the desired way forward, it was at least the best of many bad options."
communal_divides_events.15.a: "Let us hope this brings us long-sought stability."
