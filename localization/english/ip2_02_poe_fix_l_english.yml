communal_divides_events.5.f_colonial: "A [SCOPE.sCountry('overlord_scope').GetAdjectiveNoFormatting] Agent who wished to remain anonymous had this to say, "We must not be surprised. It was our hard work that kept the locals in line. It is not surprising, that now as they struggle against us, like adolescent children, they act like petulant siblings amongst themselves. They simply do not know better."
