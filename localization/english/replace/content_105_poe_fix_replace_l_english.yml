l_english:
 raj.5.t:0 "Suspected Proselytism"
 raj.5.d:2 "The presence of [SCOPE.sReligion('suspected_missionaries').GetName] $clergymen$ in [SCOPE.sState('missionaries_suspicion_state').GetName] has caused some locals to suspect that the [ROOT.GetCountry.GetName] is attempting to convert the local population."
 raj.5.f:1 ""That the [ROOT.GetCountry.GetNameNoFormatting] seeks to impose their own ideas of civilization on us is well known. Who is to say the next step is not mass conversions? They pretend to respect our faith to keep the peace, but have they not all along painted it as merely another cultural element inferior to their own? Surely they are just biding their time for the eventual project of forcing us all to adopt their beliefs.""