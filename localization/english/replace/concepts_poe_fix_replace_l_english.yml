l_english:
 concept_presidency_stability_desc:2 "$concept_presidency_stability$ is a metric for the level of unrest within one of the three [Concept('concept_presidency', '$concept_presidencies$')] of colonial India.\n\n#title The stability of a $concept_presidency$ falls within one of four brackets:#! #indent_newline:3 \n#r Critical#!: #v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_critical_lower_bound')]#!-#v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_critical_upper_bound')]#!\n#b Low#!: #v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_low_lower_bound')]#!-#v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_low_upper_bound')]#!\n#b Medium#!: #v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_medium_lower_bound')]#!-#v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_medium_upper_bound')]#!\n#b High#!: #v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_high_lower_bound')]#!-#v [GetPlayer.MakeScope.ScriptValue('uneasy_raj_stability_high_upper_bound')]#!#!\n\n#title The following conditions in a $concept_presidency$ #r decrease#! its stability:#! #indent_newline:3 \n• [Concept('concept_radical', '$concept_radicals$')] in the $concept_presidency$\n• [concept_sol] below #v 10.0#! in the $concept_presidency$\n• High average [concept_liberty_desire] of [concept_princely_state] [Concept('concept_subject', '$concept_subjects$')] in the $concept_presidency$\n• [Concept('concept_princely_state', '$concept_princely_states$')] with the #b $je_princely_states$#! [concept_journal_entry]#!\n\n#title The following conditions in the East India Company #r decrease#! stability:#! #indent_newline:3 \n• #bold Low#! [concept_approval] of [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant]\n• #bold High#! [concept_taxes] in the East India Company\n• #bold Low#! [Concept('concept_military_wage','$concept_military_wages$')] in the East India Company\n• Enacting [GetIdeology('ideology_utilitarian_millian').GetName] Reforms\n• #bold Not#! having the [GetLawType('law_total_separation').GetName] [concept_law]\n• #bold Not#! having the [GetLawType('law_professional_army').GetName] [concept_law]\n• Events and other effects #!\n\n#title The following conditions #g increase#! the stability of a $concept_presidency$:#! #indent_newline:3 \n• [Concept('concept_loyalist','$concept_loyalists$')] in the $concept_presidency$\n• [concept_sol] above #v 10.0#! in the $concept_presidency$\n• Low average [concept_liberty_desire] of [concept_princely_state] [Concept('concept_subject', '$concept_subjects$')] in the $concept_presidency$#!\n\n#title The following conditions in the East India Company #g increase#! stability:#! #indent_newline:3 \n• [concept_clout] of Native #b Indian#! [Concept('concept_interest_group', '$concept_interest_groups$')] [concept_in_government]\n• #bold High#! [concept_approval] of [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant]\n• #bold Low#! [concept_taxes] in in the East India Company\n• #bold High#! [Concept('concept_military_wage','$concept_military_wages$')] in the East India Company#!"

 concept_presidency_desc:1 "The $concept_presidencies$ are the highest level administrative units of Colonial India. There are three $concept_presidencies$, with borders delineated by [Concept('concept_georegion','$concept_georegions$')].\n\nThe #underline [GetGeographicRegion('geographic_region_bengal_presidency').GetName]#! encompasses [GetGeographicRegion('geographic_region_bengal_old').GetName], [GetGeographicRegion('geographic_region_central_india_old').GetName], and [GetGeographicRegion('geographic_region_punjab_old').GetName], spanning most of Northern India.\n\nThe #underline [GetGeographicRegion('geographic_region_bombay_presidency').GetName]#! includes [GetStateRegion('STATE_BOMBAY').GetName], stretching along India's northwest coast.\n\nThe #underline [GetGeographicRegion('geographic_region_madras_presidency').GetName]#! includes [GetStateRegion('STATE_MADRAS').GetName] and the rest of southeastern India."

 concept_princely_state_desc:1 "A $concept_princely_state$ is a state under the rule of a native Indian monarch subordinate to another nation. They possess greatly different degrees of prominence within the Indian imperial system, but all are generally subject to a similar diplomatic arrangement."

 concept_privy_purse_desc:1 "A Privy Purse is the personal income of a [Concept('concept_ruler','Monarch')]. In the context of [GetGeographicRegion('geographic_region_india').GetName], it represents the pension paid to the former ruler of a [concept_princely_state] #b annexed#! by another [concept_country] using #v The Federation of India#! [concept_journal_entry].\n\nThe $modifier_privy_purse_payments$ [concept_modifier] will be added upon annexing any $concept_princely_state$ using this $concept_journal_entry$, and will be updated upon each subsequent annexation. The #b Privy Purse#! payments will add #b National Expenses#! equivalent to #v 0.05%#! [concept_gdp] of each $concept_princely_state$ annexed this way."