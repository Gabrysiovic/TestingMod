je_communal_divides_reason:2 "@information! #b $hindu$#! and #b $muslim$#! #b #blue Unity#!#! will #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_communal_divides_unity_advance_reasons_tt advance#! or #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_communal_divides_unity_retreat_reasons_tt retreat#! based on the [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')] and [Concept('concept_activism','$concept_activism_short$')] of [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoIcon] and the [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoIcon] respectively. The rate of change will increase every five years.\n\nYearly events will allow the [ROOT.GetCountry.GetNameNoFormatting] to influence the $concept_political_movement_support_short$ and $concept_activism_short$ of one or both movements. If #b $hindu$#! or #b $muslim$#! #b #red Separatism#!#! reaches #v #red 100%#!#!, the differences between both sides will become irreconcilable and the [ROOT.GetCountry.GetAdjectiveNoFormatting] government will promise partition into separate #b $hindu$#! and #b $muslim$#! nations.#!\n$TOOLTIP_DELIMITER$\n#lore "#italic Is it possible that two nations — the Mahomedans and the Hindoos — could sit on the same throne and remain equal in power?"#!\n\nThe history of #bold Hindu-Muslim#! relations in India is both storied and complex, with episodes of collaboration and coexistence interwoven with ones of intolerance and cruelty. Nonetheless, for centuries, the two communities hobbled along under the auspices of their feudal masters.\n\nHowever, with the emergence of new, #bold national identities#! and the increasing spread of #bold ethno-religious nationalism#!, it is clear that the old ways must make way for the new. Few voices, however, agree upon what such new ways should entail. Some strive for a united #b India#!, while proponents of the #b Two-Nation Theory#! argue that until $hindus$ and $muslims$ are given separate nations, disunity and inter-communal violence will remain inevitable.#!"
create_indusstan_bangla_tt:1 "New #b $muslim$ nation(s)#! will be established from our territory as semi-autonomous [Concept('concept_dominion','$concept_dominions$')] within the framework of a confederal system."
religious_nationalist_groups_tt:1 "The [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')] and [Concept('concept_activism','$concept_activism_short$')] of [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoIcon] and the [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoIcon] will be increased for the duration of the Journal Entry"

make_delhi_capital_desc:1 "Our current capital has served its role well, but a relocation to Delhi may be opportune. With its central location and historical importance as the Mughal seat of power, the government apparatus would be well served there, and may better temper ethno-religious nationalism."

communal_divides_events.1.d:1 "Speaking from [ROOT.GetCountry.GetCapital.GetCityHubName], representatives of the [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoIcon] and [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoIcon] have formally repudiated the so-called Two-Nation theory, pledging instead eternal brotherhood between all Indians, regardless of creed or conviction."
communal_divides_events.1_tt:1 "[SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoIcon] and the [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoIcon] will receive substantial attraction maluses."

communal_divides_events.2.d:1 "Division between [GetReligion('hindu').GetNameNoIcon] and [GetReligion('sunni').GetReligiousTraitsDesc] Indians has reached a breaking point. Separatists and adherents of the Two-Nation theory seem triumphant, exclaiming that the only solution is for the $hindu$-$muslim$ populations is to separate entirely."

communal_divides_events.3.t:1 "Sectarian Division"
communal_divides_events.3.d:1 "[GetReligion('hindu').GetNameNoIcon] members of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] have spoken out over the seemingly outsized influence of its muslim members and how it may threaten the interests of hindus. Meanwhile, [GetReligion('sunni').GetReligiousTraitsDesc] members fear the opposite - hindu domination that threatens the interests of muslims.\n\n[SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoIcon] and [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoIcon] hope to exploit the internal division, but perhaps we can take advantage of the situation as well."
communal_divides_events.3.f:1 "Muhammad Khan couldn’t believe the audacity of the speaker. The man had dared to say, "I am glad to see Mr. Khan here, representing the Muslim branch of our party." He was here before him! He had fought the [ROOT.GetCountry.GetNameNoFormatting] in court! And won! And now he was just a representative of the Muslim Branch?\n\nAnd then the upstart had dared suggest a Hindu nation. What did he think all the Muslims and Sikhs would do when they heard that? Convert?"
communal_divides_events.3.a:1 "They are right to be concerned."
communal_divides_events.3.b:1 "Announce that the government will consult directly with [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoFormatting] and [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoFormatting] to address hindu and muslim concerns."
communal_divides_events.3.c:1 "Refuse to recognize the legitimacy of the [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoFormatting] and [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoFormatting]."

# NO LOC (Remove a space at the end because it was sitting there... menacingly)
communal_divides_events.4.d:1 "The [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetName] led a large and loud religious procession in [SCOPE.sState('relevant_state').GetName], stopping to perform in front of a mosque. Muslim youths responded to the taunts with a procession of their own. Matters escalated between the two groups leading to riots and violence."
communal_divides_events.4.c:1 "Both sides are at fault."

communal_divides_events.5.t:1 "Breaking Ground, Holy Ground"
communal_divides_events.5.d:1 "A new mosque is to be built on the grounds of an ancient but abandoned hindu temple. [SCOPE.sPoliticalMovement('hindu_mahasabha_scope').GetNameNoIcon] is leading a protest against the construction, arguing that the affair is another example of the government's muslim-oriented favoritism. [SCOPE.sPoliticalMovement('muslim_league_scope').GetNameNoIcon] is leading counter-protests, demanding construction be permitted as was already approved."
communal_divides_events.5.f:1 "#bold Local conflict reaches new heights!#!\nYesterday saw the third day of communal violence in [SCOPE.sState('relevant_state').GetCityHubName], as Hindoos and Mohammedans fought over the construction of a mosque in what the Hindoos believe is their area."
communal_divides_events.5.a:1 "Revoke the permits. They'll have to build somewhere else."
communal_divides_events.5.b:1 "We've already granted permission; it would be unfair to change our minds now."
communal_divides_events.5.c:1 "Just tear down some other buildings and put it up there."

communal_divides_events.6.d:1 "Despite the population of [SCOPE.sState('relevant_state').GetCityHubName] in [SCOPE.sState('relevant_state').GetName] consisting of a [GetReligion('hindu').GetNameNoIcon] majority, most of its administrators are [GetReligion('sunni').GetReligiousTraitsDesc]. This has sparked protest from Hindus who feel like their needs are being ignored."
communal_divides_events.6.b:1 "Things are fine as they are."
communal_divides_events.6.c:1 "Best we just take over administration ourselves."
