l_english:
sepoy_mutiny_events.1.d:1 "Ruling as the hereditary prime ministers of the Maratha Empire, the Bhat family were second only to the Chhatrapati in prestige and power. Now [SCOPE.sCharacter('nana_saheb_scope').GetFirstName], the adopted son of the last Peshwa comes offering his sword, promising to expel the foreigners and restore the Empire."
# NO LOC (minor formatting)
sepoy_mutiny_events.1.f:1 "The soldier cleared his throat but it did nothing to dislodge the lump stuck in there. His forebears had been the thorn in Aurangzeb's side, a mighty force that the Chhatrapati had led to freedom against the Mughal's tyranny.\n\nBut it seemed it had all been for naught, for here they were, preparing to fight another fierce foe. Would he make his ancestors proud, or would his actions fall short? The thought fell from his mind as his captain yelled, 'FORWARD MARCH.'"

sepoy_mutiny_events.2.d:1 "The catastrophic victory of the Indian mutineers has spurred heated debates within the offices of the colonial administration. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastName] must now decide whether to abandon India altogether, or to focus dwindling resources on maintaining a foothold on the continent."
sepoy_mutiny_events.2.f:1 "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] paced the length of his office, the walls barely containing his wrath. His aide stood perfectly still. He did not wish to end up like contents of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s tea tray, plastered across the map of India.\n\nIndia, the golden goose they had pinned by the wings, the head, and the tail had imploded on them and all their options reeked. If it were up to him, he would take Calcutta, their first foothold, and leave the rest. Then again, Bombay had cost them dearly, and Madras had much left to offer. A tough choice -BANG!\nThe aide flinched; the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] had fired his pistol into the wall. Perhaps it was time he went to see if there were more messages..."
sepoy_mutiny_events.2.a:1 "India is lost. Report back to [ROOT.GetCountry.GetOverlord.GetCapital.GetCityHubName]."
india_retreat_to_bengal_tt:1 "All [concept_princely_state] [Concept('concept_subject', '$concept_subjects$')] outside of [GetGeographicRegion('geographic_region_bengal_old').GetName] will become independent. All of our [GetGeographicRegion('geographic_region_india').GetName] states outside of [GetGeographicRegion('geographic_region_bengal_old').GetName] will be divided among the princes."
india_retreat_to_bombay_tt:1 "All [concept_princely_state] [Concept('concept_subject', '$concept_subjects$')] outside of [GetGeographicRegion('geographic_region_bombay_old').GetName] will become independent. All of our [GetGeographicRegion('geographic_region_india').GetName] states outside of [GetGeographicRegion('geographic_region_bombay_old').GetName] will be divided among the princes."
india_retreat_to_madras_tt:1 "All [concept_princely_state] [Concept('concept_subject', '$concept_subjects$')] outside of [GetGeographicRegion('geographic_region_madras_old').GetName] will become independent. All of our [GetGeographicRegion('geographic_region_india').GetName] states outside of [GetGeographicRegion('geographic_region_madras_old').GetName] will be divided among the princes."

sepoy_mutiny_events.3.d:1 "The breaking point has been reached. Across India, sepoys are striking their regimental colors and taking up arms against the [SCOPE.sCountry('india_scope').GetName]. Joined by seditious [Concept('concept_princely_state', '$concept_princely_states$')] and disaffected locals of all ranks, they have seized power in cities across the continent."
# NO LOC (fix typo)
sepoy_mutiny_events.3.f:1 "As the sepoy from Poona fires at his captain, a Muslim lad hands him more bullets. A Sikh sepoy, bleeding out from his wounds, takes in the sight. What would their forefathers say if they saw them fighting together instead of against each other? And then, as the life leaves him, a more pressing thought occurs to him; what will their grandchildren say of their actions today? Waheguru, will they be proud? Ashamed? Will they even remember?"
sepoy_mutiny_events.3.tt_1:1 "Rebellious [Concept('concept_princely_state', '$concept_princely_states$')] will declare [concept_war] on the [ROOT.GetCountry.GetName]"

sepoy_mutiny_events.4.d:1 "Sepoys in the employ of the [SCOPE.sCountry('eic_scope').GetName] have mutinied against their old masters, throwing the subcontinent into disarray. Hawkish members of the [ROOT.GetCountry.GetAdjective] court loudly argue for us to join the rebel cause, so we may oust the foreigners from India together."
sepoy_mutiny_events.4.e:1 "Stay out of this and let the cards fall where they may."

sepoy_mutiny_events.6.d:1 "Ever since the adoption of the new standard-issue Enfield rifle-musket and its bite-and-tear cartridges, rumors have been spreading among the sepoy of the presidency armies. Many believe the strange new taste is due to pork or cow fat, a grave religious violation for the [GetReligion('sunni').GetReligiousTraitsDesc] and [GetReligion('hindu').GetNameNoIcon] [GetPopType('soldiers').GetName]."
sepoy_mutiny_events.6.f:1 ""Something isn't right I tell you. What was wrong with the old cartridges? They certainly didn't taste this way."\n\n"But the officers assure us it's nothing. They wouldn't lie to us... would they?""
sepoy_mutiny_events.6.a:1 "Could something so trivial spark a rebellion?"

sepoy_mutiny_events.7.d:1 "Many sepoys continue to believe their new cartridges have been greased with pork or cow fat. Officers insist that the only elements used are beeswax and mutton tallow, but most soldiers remain skeptical.\n\nSome have proposed a compromise: letting the men make their own cartridges with vegetable oil."
sepoy_mutiny_events.7.f:1 ""I heard some of the officers were letting their men make their own cartridges to replace the new ones."\n\n"That only begs the question: what was wrong with #b these#! ones?""
sepoy_mutiny_events.7.a:1 "We paid good money for these cartridges and they will use them."
sepoy_mutiny_events.7.b:1 "If it eases their minds they can make their own cartridges."
sepoy_mutiny_cartridge_grease_exploration:1 "New Cartridge Making"

sepoy_mutiny_events.8.t:1 "New Cartridges, Old Drills"
sepoy_mutiny_events.8.d:1 "As the rumors continue to spread among the sepoy, many are refusing to practice the standard drill of biting open the cartridges to free the gunpowder inside. A few officers have suggested letting the suspicious soldiers tear the cartridges with their hands instead, but others argue it will degrade combat efficiency."
sepoy_mutiny_events.8.f:1 ""As if letting us use our hands was a reasonble compromise anyway. Many of us have drilled by biting for years. All it takes is one lapse into old habit before a grievous sin has been committed.""
sepoy_mutiny_events.8.a:1 "The drills will remain as is."
sepoy_mutiny_events.8.b:1 "Permit hand-tearing of cartridges."

sepoy_mutiny_events.9.t:1 "Forced Conversion?"
sepoy_mutiny_events.9.d:1 "Some sepoy now believe the allegedly pork and cow fat-greased cartridges are an attempt at forced religious conversion. With the theory spreading quickly, more and more men are refusing to follow orders to use the new cartridges."
sepoy_mutiny_events.9.f:1 ""It all makes sense now. Hadn't they been trying this for years - taking our rights and giving them to converts? This is just the next step, a dirty trick to make us violate our beliefs in the hope we join theirs instead.""
sepoy_mutiny_events.9.a:1 "Punish anyone spreading such rumors."
sepoy_mutiny_events.9.b:1 "If we react it'll only make them more suspicious."

sepoy_mutiny_events.10.t:1 "Begrudging Acquiescence"
sepoy_mutiny_events.10.d:1 "The sepoys have begrudgingly accepted the situation regarding the new cartridges, though many still view them and the [ROOT.GetCountry.GetName] with suspicion."
sepoy_mutiny_events.10.f:1 ""You see, Mason? I told you there was nothing to worry about."\n\n"I wouldn't put my guard down just yet, sir. It only takes a small spark to light a fire, and we both know India may as well be a box of kindling right now.""
sepoy_mutiny_events.10.a:1 "We've managed this debacle as best we could."

