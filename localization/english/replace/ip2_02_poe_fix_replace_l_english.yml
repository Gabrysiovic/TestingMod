# NO LOC (adding a "The")
je_sepoy_mutiny:1 "The Sepoy Mutiny"
je_sepoy_mutiny_reason:1 "Mutiny and rebellion has broken out against colonial authority in #b India#!. If the [SCOPE.sCountry('india_scope').GetNameNoFormatting] is to maintain control of the subcontinent, the rebellion must be crushed completely."

je_uneasy_raj_tt_1:1 "Time has ran out without #red Instability#! reaching #v 600#!"
je_uneasy_raj_tt_2:1 "#red Indian Instability#! has reached #v 600#!"
je_uneasy_raj_tt_3:1 "Debug Values: [SCOPE.sCountry('raj_scope').MakeScope.Var('bengal_population').GetValue] [SCOPE.sJournalEntry('journal_entry').MakeScope.Var('num_months').GetValue]"
je_uneasy_raj_tt_4:2 "The severity of the revolt will be decided by the [Concept('concept_presidency_stability','$concept_presidency_stability_short$')] of each of the three [Concept('concept_presidency', '$concept_presidencies$')], ranging from minor unrest and defections to a total collapse of colonial authority.\n\nWhen the revolt breaks out, the [concept_attitude] of each [concept_princely_state] will impact which side it chooses to take, or if it chooses to stay neutral. $concept_princely_states$ and neighboring countries with the #b $je_princely_states$#! [concept_journal_entry] will always join the rebellion."
je_uneasy_raj_reason:1 "@information! Various factors will affect the [Concept('concept_presidency_stability','$concept_presidency_stability_short$')] of the three [Concept('concept_presidency', '$concept_presidencies$')], which in turn affects the overall #red Instability#! of the subcontinent. If #red Instability#! reaches #v 600#! before time has run out, an #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_uneasy_raj_tt_4 #b Indian Rebellion#!#! will break out within the [SCOPE.sCountry('raj_scope').GetName].\n\n#red Instability#! will also increase on its own by #v 1.5#! each month, increasing the risk of rebellion over time but also lessening its potential severity.\n\n@warning! Any [Concept('concept_subject', '$concept_subjects$')] of the [SCOPE.sCountry('raj_scope').GetName] with the #b $je_princely_states$#! [concept_journal_entry] will lower the $concept_presidency_stability_short$ of their $concept_presidency$. Countries with the #b $je_princely_states$#! $concept_journal_entry$ will also attempt to spread it to other [Concept('concept_princely_state', '$concept_princely_states$')].\n\n$FOMENTING_REBELLION_COUNTRIES$\n$TOOLTIP_DELIMITER$\n#lore Unrest is brewing in the [SCOPE.sCountry('raj_scope').GetNameNoFormatting]. Troubled by harsh taxation regimes, increasing disrespect for local customs, and territorial expansion at the expense of native princes, Indian opposition to foreign rule has been mounting in recent years.\n\nWorse still, discord can be found even within the proud ranks of the native sepoy regiments, who resent any challenge to their traditional status and privileges.#!"

