l_english:
  je_british_dictate_plantations:1 "Colonial Dictate: Agriculture"
  je_british_dictate_plantations_reason:1 "With an abundance of fertile land and countless hands to work it, the soil of India is ripe for trade and treasure. By properly re-organizing the land into cash crop plantations, we can unlock the true wealth of the Indian subcontinent."

  je_british_dictate_military:1 "Colonial Dictate: Military"
  je_british_dictate_military_reason:1 "An India unprotected is an India waiting to be lost. We must ensure both our colonial army and navy are sufficiently manned, equipped, and modernized to protect the [ROOT.GetCountry.GetNameNoFormatting] from all foreign threats."

  je_british_dictate_universities:1 "Colonial Dictate: Education"
  je_british_dictate_universities_reason:1 "A growing civil service is necessary to properly govern the Indian subcontinent, and in turn an educated populace is needed to fill its many roles. We must ensure our Indian subjects are properly educated and qualified for this purpose lest the vastness of India overwhelm our administration."

  upset_every_princely_state_relations_tt:1 "[concept_relations] with every [concept_princely_state] will further deteriorate by #negative_value [SCOPE.ScriptValue('basic_princely_state_relations_change')]#!"

  india_events.2.b:1 "A chance for the [SCOPE.sPoliticalMovement('indian_national_movement').GetNameNoFormatting] to offer its loyalty, and humbly request sovereign home rule."

  koh_i_noor_in_europe_tt:1 "A #bold Diplomatically Relevant#! [concept_country] is in possession of the #bold Koh-i-Noor#! diamond"

  india_events.4.t:1 "[SCOPE.sCountry('india_scope').GetNameNoFormatting] Demands Return of the Koh-i-Noor"
  india_events.4.f:1 ""It's just one jewel and we have so many. Surely the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] wouldn't mind returning it."\n\n"High Commissioner, you will find that nothing is so simple. That jewel is a [ROOT.GetCountry.GetAdjectiveNoFormatting] treasure, and we won't just be giving it away.""

  india_events.13.a:1 "He will be allowed to realize his full potential."

  add_small_indian_radicals_tt:1 "[SCOPE.ScriptValue('small_radicals')|-=1%] of [GetCulture('bengali').GetHeritageTrait.GetTraitGroup.GetName] [Concept('concept_pop', '$concept_pops$')] in [ROOT.GetCountry.GetNameNoFlag] become more [concept_radical]"
  add_medium_indian_radicals_tt:1 "[SCOPE.ScriptValue('medium_radicals')|-=1%] of [GetCulture('bengali').GetHeritageTrait.GetTraitGroup.GetName] [Concept('concept_pop', '$concept_pops$')] in [ROOT.GetCountry.GetNameNoFlag] become more [concept_radical]"
  add_large_indian_radicals_tt:1 "[SCOPE.ScriptValue('large_radicals')|-=1%] of [GetCulture('bengali').GetHeritageTrait.GetTraitGroup.GetName] [Concept('concept_pop', '$concept_pops$')] in [ROOT.GetCountry.GetNameNoFlag] become more [concept_radical]"
