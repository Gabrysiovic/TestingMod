 je_india_home_rule_progressbar: "Indian Nationalism"
 je_india_home_rule_progressbar_desc: "Indian Nationalism: ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/500)"

 je_india_home_rule_request_democracy_permission_desc: "The nationalist calls for self-governance have grown too loud to ignore. We must petition our suzerain for permission to enact a #tooltippable;tooltip:[GetPlayer.GetTooltipTag],indian_democratic_reforms_tt democratic reform#!.\n\n[SCOPE.sCountry('india_scope').GetOverlord.GetNameNoFlag] will be more likely to accept if the combined [Concept('concept_political_movement_support', '$concept_political_movement_support_short$')] and [Concept('concept_activism', '$concept_activism_short$')] of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName] exceeds #v 70%#!. A #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ig_indian_reformist_tt reformist#! [SCOPE.sCountry('india_scope').GetOverlord.GetAdjectiveNoFormatting] government will also be more likely to accept, while an #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ig_indian_imperialist_tt imperialist#! one will be less likely.\n\nIf [SCOPE.sCountry('india_scope').GetOverlord.GetNameNoFormatting] refuses, it will increase the number of native Indian [Concept('concept_radical', 'radicals')], the disapproval of the #b $lobby_indian_national_congress_icon$ $lobby_indian_national_congress_name$#!, and the [Concept('concept_activism', '$concept_activism_short$')] of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName].[ROOT.GetCountry.GetCustom('get_je_india_home_rule_switch_from_chartered_company_notice')]"

 requested_dop_permission_tt: "Has not requested a reform or sovereignty in the last #Bold 2#! years"

 je_india_nationalism_britain_indian_self_governance: "Authorize Reform"
 je_india_nationalism_britain_indian_self_governance_desc: "With the growing agitation of the [SCOPE.sPoliticalMovement('indian_national_movement').GetName], we must enact a #tooltippable;tooltip:[GetPlayer.GetTooltipTag],indian_democratic_reforms_tt reform#! to appease the native population. Doing so will temporarily appease the movement's more radical elements, but increase the rate of [concept_indian_nationalism].[ROOT.GetCountry.GetCustom('get_je_india_home_rule_switch_from_chartered_company_notice')]"

 je_india_nationalism_britain_dispatch_simon_commission_desc: "After enacting democratic enforms in [SCOPE.sCountry('india_scope').GetName], we have promised to send a commission to assess the need for further reforms in #v [SCOPE.sJournalEntry('journal_entry').MakeScope.Var('simon_commission_timer_var').GetValue|v0]#! months.\n\nA #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ig_indian_reformist_tt reformist#! government will send a #b reformist#!-leaning commission more likely to advance the [concept_indian_nationalism] progress bar, while an #tooltippable;tooltip:[GetPlayer.GetTooltipTag],ig_indian_imperialist_tt imperialist#! government will send a #b imperialist#!-leaning commission more likely to delay its progress. However, if we are concerned about a change in government before the commission is sent, we may choose to send the commission early with our current government."
 simon_commission_dispatch_timer_tt: "If this action is not taken, the #bold Indian Statutory Commission#! will be dispatched in [SCOPE.sJournalEntry('journal_entry').MakeScope.Var('simon_commission_timer_var').GetValue|v0] months"

 sepoy_mutiny_events.11.t: "The Stalwart Raj"
 sepoy_mutiny_events.11.d: "The [ROOT.GetCountry.GetName] has proven its ability to successfully manage the subcontinent. With native resentment placated and the immediate threat of rebellion vanquished, Colonial rule in #b India#! is now firmly cemented."
 sepoy_mutiny_events.11.a: "A job well done by our administrators."