  #state only
  add_huge_indian_radicals_tt:1 "#v 20%#! of [GetCulture('bengali').GetHeritageTrait.GetTraitGroup.GetName] [Concept('concept_pop', '$concept_pops$')] in [SCOPE.sState('swadeshi_state').GetName] become more [concept_radical]"

